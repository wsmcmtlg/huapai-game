  },
  'zhao': {
    '1_3_0': 3,  '2_2_0': 4,
  },
  'chuan': {
    '2_3_0': 6,
  },
};


/* ═══ 启动 ═══ */

function _lookupJingHu(cards, mtype, isMain) {
  let flower = 0, skin = 0, wild = 0;
  const hasBlack = cards.some(c => BLACK_JING.has(c.ch));
  for (const c of cards) {
    if (c.isWild) { wild++; continue; }
    if (!c.isJin) continue;
    if (c.v === 'flower') flower++;
    else skin++;
  }
  const key = flower + '_' + skin + '_' + wild;
  if (hasBlack) {
    // 乙九(黑精)使用JING_BLACK_TABLE查表
    const table = JING_BLACK_TABLE[mtype];
    if (table && table[key] !== undefined) {
      const val = table[key];
      return isMain ? val * 2 : val;
    }
    return null;
  } else {
    const table = JING_RED_TABLE[mtype];
    if (table && table[key] !== undefined) {
      const val = table[key];
      return isMain ? val * 2 : val;
    }
    return null;
  }
}


function _calcMeld(cards, mtype, isMain, mainJinChar) {
  const chars = cards.map(c => c.ch);
  const hasJing = chars.some(ch => JING_CHARS.has(ch));
  const wc = cards.filter(c => c.isWild).length;

  if (mtype === 'pair') {
    // 对子(眼): 红牌对子无精牌=0胡；有精牌或赖子→逐张计胡(黑花精+1,皮红精+1,花红精+2,赖子+2)
    if (hasJing || wc > 0) {
      const r = _lookupJingHu(cards, 'pair', isMain);
      if (r !== null) return r;
      // 查表未命中(乙九黑精): 逐张计胡
      let h = 0;
      for (const c of cards) {
        if (c.isWild) { let wH = 2; if (mainJinChar) wH *= 2; h += wH; continue; }
        if (!c.isJin) continue;
        let jH = 0;
        if (RED_JING.has(c.ch)) jH = c.v === 'flower' ? 2 : 1;
        else if (BLACK_JING.has(c.ch)) jH = c.v === 'flower' ? 1 : 0;
        if (mainJinChar && c.ch === mainJinChar) jH *= 2;
        h += jH;
      }
      return h;
    }
    return 0;
  }
  if (mtype === 'kou') {
    // 口眼(半顺): 含赖子→逐张计胡; 含精牌→逐张加分; 无精→0胡; 主精翻倍×2
    if (wc > 0) { let h = 0; for (const c of cards) { if (c.isWild) h += 2; else if (c.isJin) { if (RED_JING.has(c.ch)) h += c.v === 'flower' ? 2 : 1; else h += c.v === 'flower' ? 1 : 0; } } if (isMain) h *= 2; return h; }
    if (!hasJing) return 0;
    let h = 0;
    for (const c of cards) {
      if (!c.isJin) continue;
      if (RED_JING.has(c.ch)) h += c.v === 'flower' ? 2 : 1;
      else if (BLACK_JING.has(c.ch)) h += c.v === 'flower' ? 1 : 0;
    }
    if (isMain) h *= 2;
    return h;
  }
  if (mtype === 'kan') {
    if (!hasJing && wc === 0) {
      // 纯非精坎: 红坎=2胡，黑坎=1胡
      return cards.every(c => RED_CHARS.has(c.ch)) ? 2 : 1;
    }
    // 涉精牌查表
    const r = _lookupJingHu(cards, 'kan', isMain);
    if (r !== null) return r;
    // 兜底：逐张计胡
    const base = cards.every(c => RED_CHARS.has(c.ch)) ? 2 : 1;
    let bonus = 0;
    for (const c of cards) {
      if (c.isWild) bonus += 2;
      else if (c.isJin) { if (RED_JING.has(c.ch)) bonus += c.v === 'flower' ? 2 : 1; else bonus += c.v === 'flower' ? 1 : 0; }
    }
    let hu = base + bonus;
    if (isMain) hu *= 2;
    return hu;
  }
  if (mtype === 'zhao' || mtype === 'zha') {
    if (!hasJing && wc === 0) {
      // 纯非精招/扎: 红=4胡，黑=2胡
      return cards.every(c => RED_CHARS.has(c.ch)) ? 4 : 2;
    }
    // 涉精牌查表（招/扎共用zhao表）
    const r = _lookupJingHu(cards, 'zhao', isMain);
    if (r !== null) return r;
    // 兜底
    const base = cards.every(c => RED_CHARS.has(c.ch)) ? 4 : 2;
    let bonus = 0;
    for (const c of cards) {
      if (c.isWild) bonus += 2;
      else if (c.isJin) { if (RED_JING.has(c.ch)) bonus += c.v === 'flower' ? 2 : 1; else bonus += c.v === 'flower' ? 1 : 0; }
    }
    let hu = base + bonus;
    if (isMain) hu *= 2;
    return hu;
  }
  if (mtype === 'chuan') {
    if (!hasJing && wc === 0) return cards.every(c => RED_CHARS.has(c.ch)) ? 8 : 4;
    const r = _lookupJingHu(cards, 'chuan', isMain);
    if (r !== null) return r;
    const base = cards.every(c => RED_CHARS.has(c.ch)) ? 8 : 4;
    let bonus = 0;
    for (const c of cards) {
      if (c.isWild) bonus += 2;
      else if (c.isJin) { if (RED_JING.has(c.ch)) bonus += c.v === 'flower' ? 2 : 1; else bonus += c.v === 'flower' ? 1 : 0; }
    }
    let hu = base + bonus;
    if (isMain) hu *= 2;
    return hu;
  }
  if (mtype === 'fan') {
    if (!hasJing && wc === 0) return cards.every(c => RED_CHARS.has(c.ch)) ? 8 : 4;
    // 泛牌与穿牌共用chuan查表
    const r = _lookupJingHu(cards, 'chuan', isMain);
    if (r !== null) return r;
    const base = cards.every(c => RED_CHARS.has(c.ch)) ? 8 : 4;
    let bonus = 0;
    for (const c of cards) {
      if (c.isWild) bonus += 2;
      else if (c.isJin) { if (RED_JING.has(c.ch)) bonus += c.v === 'flower' ? 2 : 1; else bonus += c.v === 'flower' ? 1 : 0; }
    }
    let hu = base + bonus;
    if (isMain) hu *= 2;
    return hu;
  }
  if (mtype === 'pen') {
    const first = cards.find(c => !c.isWild);
    if (!first) return 0;
    const base = RED_CHARS.has(first.ch) ? 1 : 0;
    let bonus = 0;
    for (const c of cards) {
      if (c.isWild) bonus += 2;
      else if (c.isJin) { if (RED_JING.has(c.ch)) bonus += c.v === 'flower' ? 2 : 1; else bonus += c.v === 'flower' ? 1 : 0; }
    }
    let hu = base + bonus;
    if (isMain) hu *= 2;
    return hu;
  }
  if (mtype === 'seq') {
    const charSet = new Set(chars);
    const isRedSeq = [...RED_SEQ_FROZEN].some(rs => rs.size === charSet.size && [...rs].every(ch => charSet.has(ch)));
    const base = isRedSeq ? 1 : 0;
    let bonus = 0;
    for (const c of cards) {
      if (c.isWild) { bonus += 2; continue; }
      if (!c.isJin) continue;
      let jHu = 0;
      if (RED_JING.has(c.ch)) jHu = c.v === 'flower' ? 2 : 1;
      else if (BLACK_JING.has(c.ch)) jHu = c.v === 'flower' ? 1 : 0;
      if (mainJinChar && c.ch === mainJinChar) jHu *= 2;
      bonus += jHu;
    }
    return base + bonus;
  }
  return 0;
}

function _calcTotalHu(melds, mainJin) {
  let total = 0;
  const breakdown = [];
  for (const m of melds) {
    const isMain = mainJin && m.cards.some(c => c.ch === mainJin);
    const hu = _calcMeld(m.cards, m.type, isMain, mainJin);
    total += hu;
    breakdown.push({type:m.type, chars:m.cards.map(c=>c.ch).join(''), hu, label:_meldLabel(m.type)});
  }
  return {total, breakdown};
}

function _meldLabel(type) {
  const m = {pair:'对子(眼)',kou:'口眼(半顺子)',kan:'坎牌',zhao:'招牌',zha:'扎牌',chuan:'穿牌',fan:'泛牌',seq:'顺子',pen:'碰牌'};
  return m[type] || type;
}

// ═══════════════════════════════════════════════════
// 递归拆分（支持赖子通配）
// ═══════════════════════════════════════════════════
function _partition(counts, wildList, wildUsed, handCards, melds, depth) {
  if (depth === undefined) depth = 0;
  if (depth > 15) return false;
  const rem = Object.entries(counts).filter(([,v]) => v > 0);
  const aw = wildUsed.filter(u => !u).length;
  if (rem.length === 0) return aw === 0;
  const [ch, cnt] = rem[0];

  function gfw() { for (let i=0;i<wildUsed.length;i++) if(!wildUsed[i]) return i; return null; }
  function gfws(n) { const r=[]; for(let i=0;i<wildUsed.length;i++){if(!wildUsed[i]){r.push(i);if(r.length===n)break;}} return r.length===n?r:null; }
  function tc(c,n) { const r=[]; for(const cd of handCards){if(cd.ch===c&&!cd.isWild&&!r.includes(cd)){r.push(cd);if(r.length===n)break;}} return r; }

  // 1. 坎牌(3同字) — 统牌参与时改为碰牌
  if (cnt >= 3) {
    const cd = tc(ch, 3);
    if (cd.length === 3) {
      counts[ch] -= 3; if(counts[ch]===0) delete counts[ch];
      const mtype = cd.some(c => c.isTongCard) ? 'pen' : 'kan';
      melds.push({type:mtype,chars:[ch,ch,ch],cards:cd});
      if (_partition(counts,wildList,wildUsed,handCards,melds,depth+1)) return true;
      melds.pop(); counts[ch] = cnt;
    }
  }
  // 3. 含赖子坎(2普通+1赖) — 统牌参与时改为碰牌
  if (cnt >= 2 && aw > 0 && WILD_USABLE.has(ch)) {
    const fi = gfw();
    if (fi !== null && fi < wildList.length) {
      const cd = tc(ch, 2);
      if (cd.length === 2) {
        wildUsed[fi] = true; counts[ch] -= 2; if(counts[ch]===0) delete counts[ch];
        const mtype = cd.some(c => c.isTongCard) ? 'pen' : 'kan';
        melds.push({type:mtype,chars:[ch,ch,ch],cards:[...cd,wildList[fi]]});
        if (_partition(counts,wildList,wildUsed,handCards,melds,depth+1)) return true;
        melds.pop(); counts[ch] = cnt; wildUsed[fi] = false;
      }
    }
  }
  // 4. 纯赖子坎(1普通+2赖) — 统牌参与时改为碰牌
  if (cnt >= 1 && aw >= 2 && WILD_USABLE.has(ch)) {
    const fis = gfws(2);
    if (fis && fis.every(i => i < wildList.length)) {
      const cd = tc(ch, 1);
      if (cd.length === 1) {
        fis.forEach(i => wildUsed[i] = true);
        counts[ch] -= 1; if(counts[ch]===0) delete counts[ch];
        const mtype = cd.some(c => c.isTongCard) ? 'pen' : 'kan';
        melds.push({type:mtype,chars:[ch,ch,ch],cards:[...cd,...fis.map(i=>wildList[i])]});
        if (_partition(counts,wildList,wildUsed,handCards,melds,depth+1)) return true;
        melds.pop(); counts[ch] = cnt; fis.forEach(i => wildUsed[i] = false);
      }
    }
  }
  // 5. 纯顺子（搜索所有rem字关联的顺子，避免贪心遗漏）
  const seqs5 = new Set((SEQ_BY_CHAR[ch]||[]).map(s=>s.join(',')));
  for (const och of rem) { if(och===ch) continue; for(const s of(SEQ_BY_CHAR[och]||[])){if(s.includes(ch))seqs5.add(s.join(','));} }
  for (const seqKey of seqs5) { const seq = seqKey.split(',');
    if (seq.every(s => (counts[s]||0) > 0)) {
      const used = new Set(); const cd = []; let ok = true;
      for (const s of seq) {
        let found = false;
        for (const c of handCards) {
          if (c.ch===s && !c.isWild && !used.has(c)) { cd.push(c); used.add(c); found=true; break; }
        }
        if (!found) { ok=false; break; }
      }
      if (ok && cd.length===3) {
        seq.forEach(s => { counts[s]--; if(counts[s]===0) delete counts[s]; });
        melds.push({type:'seq',chars:[...seq],cards:cd});
        if (_partition(counts,wildList,wildUsed,handCards,melds,depth+1)) return true;
        melds.pop();
        seq.forEach(s => { counts[s] = (counts[s]||0) + 1; });
      }
    }
  }
  // 6. 含赖子顺子（搜索所有rem字关联的顺子）
  if (aw > 0) {
    const fi = gfw();
    if (fi !== null && fi < wildList.length) {
      const seqs6 = new Set((SEQ_BY_CHAR[ch]||[]).map(s=>s.join(',')));
      for (const och of rem) { if(och===ch) continue; for(const s of(SEQ_BY_CHAR[och]||[])){if(s.includes(ch))seqs6.add(s.join(','));} }
      for (const seqKey of seqs6) { const seq = seqKey.split(',');
        const avail = seq.reduce((s,x) => s + (counts[x]||0), 0);
        if (avail === 2) {
          for (let gi = 0; gi < 3; gi++) {
            const gapCh = seq[gi];
            if ((counts[gapCh]||0) === 0 && WILD_USABLE.has(gapCh)) {
              const used = new Set(); const cd = []; let ok = true;
              for (let i = 0; i < 3; i++) {
                if (i === gi) { cd.push(wildList[fi]); continue; }
                const sc = seq[i];
                let found = false;
                for (const c of handCards) {
                  if (c.ch===sc && !c.isWild && !used.has(c)) { cd.push(c); used.add(c); found=true; break; }
                }
                if (!found) { ok=false; break; }
              }
              if (ok && cd.length===3) {
                wildUsed[fi] = true;
                seq.forEach((sc,i) => { if(i!==gi){counts[sc]--;if(counts[sc]===0)delete counts[sc];} });
                melds.push({type:'seq',chars:[...seq],cards:cd});
                if (_partition(counts,wildList,wildUsed,handCards,melds,depth+1)) return true;
                melds.pop();
                seq.forEach((sc,i) => { if(i!==gi){counts[sc]=(counts[sc]||0)+1;} });
                wildUsed[fi] = false;
              }
            }
          }
        }
      }
    }
  }
  return false;
}

// ═══════════════════════════════════════════════════
// 完整胡牌分析（支持对子眼+口眼+赖子眼+预成型melds）
// ═══════════════════════════════════════════════════
function analyzeHand(cards, preMelds) {
  if (!cards || cards.length < 2) return null;
  if (!preMelds) preMelds = [];
  const totalAll = cards.length + preMelds.reduce((s,m) => s + m.cards.length, 0);
  if (totalAll < 5) return null;

  const wildCards = cards.filter(c => c.isWild);
  const normalCards = cards.filter(c => !c.isWild);
  const cc = {};
  for (const c of normalCards) cc[c.ch] = (cc[c.ch]||0) + 1;

  let best = null;

  function tryRes(melds) {
    const am = [...preMelds, ...melds];
    const aj = new Set();
    for (const m of am) for (const c of m.cards) if (RED_JING.has(c.ch)) aj.add(c.ch);
    const mjs = [null, ...aj];
    for (const mj of mjs) {
      const {total} = _calcTotalHu(am, mj);
      if (total >= MIN_HU && (!best || total > best.totalHu)) {
        best = {
          isWin:true, totalHu:total, melds:am, mainJin:mj,
          eyeType:melds[0].type, eyeChars:melds[0].cards.map(c=>c.ch)
        };
      }
    }
  }

  function tc(ch, n, excludeSet) {
    const r = [];
    for (const c of normalCards) {
      if (c.ch===ch && !c.isWild && !r.includes(c) && (!excludeSet || !excludeSet.has(c))) {
        r.push(c); if(r.length===n) break;
      }
    }
    return r;
  }

  // 生成所有可能的"眼"候选（用于单眼和两眼枚举）
  function enumEyeCandidates(cc, wildCards) {
    const eyes = []; // {removed:{ch:n,...}, wildUsed:n, cards:[], type:'pair'|'kou'}
    // 对子眼
    for (const ch in cc) {
      if (cc[ch] >= 2) eyes.push({removed:{[ch]:2}, wildUsed:0, cards:tc(ch,2), type:'pair'});
    }
    // 赖子+普通牌对子（赖子只能通配三五七）
    if (wildCards.length > 0) {
      for (const ch in cc) {
        if (!WILD_USABLE.has(ch)) continue;
        if (cc[ch] >= 1) eyes.push({removed:{[ch]:1}, wildUsed:1, cards:[...tc(ch,1), wildCards[0]], type:'pair'});
      }
      // 纯赖子对子(赖赖)不合法：赖子只能当三五七，赖赖不是合法对子
    }
    // 口眼
    for (const [ch1, ch2] of ALL_KOU_LIST) {
      const ks = new Set([ch1, ch2]);
      const can = ALL_SEQS.some(seq => {
        const ss = new Set(seq);
        return ss.size === 3 && [...seq].filter(x => !ks.has(x)).length === 1;
      });
      if (!can) continue;
      if (ch1 === ch2) {
        if ((cc[ch1]||0) >= 2) eyes.push({removed:{[ch1]:2}, wildUsed:0, cards:tc(ch1,2), type:'kou'});
      } else {
        if ((cc[ch1]||0) >= 1 && (cc[ch2]||0) >= 1)
          eyes.push({removed:{[ch1]:1,[ch2]:1}, wildUsed:0, cards:[...tc(ch1,1), ...tc(ch2,1)], type:'kou'});
      }
    }
    // 赖子口眼
    if (wildCards.length > 0) {
      for (const wch of WILD_USABLE) {
        for (const ch in cc) {
          const ks = new Set([ch, wch]);
          const can = ALL_SEQS.some(seq => {
            const ss = new Set(seq);
            return ss.size === 3 && [...seq].filter(x => !ks.has(x)).length === 1;
          });
          if (can) eyes.push({removed:{[ch]:1}, wildUsed:1, cards:[...tc(ch,1), wildCards[0]], type:'kou'});
        }
      }
    }
    return eyes;
  }

  // 单眼尝试（原逻辑）
  function trySingleEye(eye) {
    const cnt = Object.assign({}, cc);
    for (const [ch, n] of Object.entries(eye.removed)) {
      cnt[ch] -= n;
      if (cnt[ch] === 0) delete cnt[ch];
    }
    if (eye.wildUsed > wildCards.length) return;
    const wu = Array(eye.wildUsed).fill(true).concat(Array(wildCards.length - eye.wildUsed).fill(false));
    const wcRem = wildCards.slice(eye.wildUsed);
    const usedSet = new Set(eye.cards);
    const melds = [{type:eye.type, chars:eye.cards.map(c=>c.ch), cards:eye.cards}];
    if (_partition(cnt, wcRem, wu, normalCards, melds)) tryRes(melds);
  }

  // 两眼尝试（7+2两听）
  function tryTwoEyes(eye1, eye2) {
    // 合并两个眼的消耗
    const removed = Object.assign({}, eye1.removed);
    for (const [ch, n] of Object.entries(eye2.removed)) {
      removed[ch] = (removed[ch]||0) + n;
    }
    // 检查消耗是否合法（不超过cc中的数量）
    for (const [ch, n] of Object.entries(removed)) {
      if ((cc[ch]||0) < n) return;
    }
    const totalWildUsed = eye1.wildUsed + eye2.wildUsed;
    if (totalWildUsed > wildCards.length) return;
    // 检查第二眼的cards是否与第一眼重叠
    const usedSet = new Set(eye1.cards);
    const eye2Cards = [];
    for (const c of eye2.cards) {
      if (usedSet.has(c)) return; // 重叠，跳过
      eye2Cards.push(c);
    }
    const cnt = Object.assign({}, cc);
    for (const [ch, n] of Object.entries(removed)) {
      cnt[ch] -= n;
      if (cnt[ch] === 0) delete cnt[ch];
    }
    const wu = Array(totalWildUsed).fill(true).concat(Array(wildCards.length - totalWildUsed).fill(false));
    const wcRem = wildCards.slice(totalWildUsed);
    const allUsedSet = new Set([...eye1.cards, ...eye2Cards]);
    const melds = [
      {type:eye1.type, chars:eye1.cards.map(c=>c.ch), cards:eye1.cards},
      {type:eye2.type, chars:eye2Cards.map(c=>c.ch), cards:eye2Cards}
    ];
    if (_partition(cnt, wcRem, wu, normalCards, melds)) tryRes(melds);
  }

  // 枚举所有眼组合
  const eyeCandidates = enumEyeCandidates(cc, wildCards);
  // 对子眼候选（用于两听7+2）
  const pairEyes = eyeCandidates.filter(e => e.type === 'pair');
  // 单眼（8+1摞听）：对子眼和口眼都可以
  for (const eye of eyeCandidates) trySingleEye(eye);
  // 两眼（7+2两听）：只使用对子眼，口眼只用于摞听
  for (let i = 0; i < pairEyes.length; i++) {
    for (let j = i + 1; j < pairEyes.length; j++) {
      tryTwoEyes(pairEyes[i], pairEyes[j]);
    }
  }

  return best;
}

// 胡数→得分对照表（每5胡一档）
// 档位0=17-21, 档位1=22-26, 档位2=27-31, ...
function _huTier(hu) {
  if (hu < 17) return -1;
  return Math.floor((hu - 17) / 5);
}
function calcPoints(hu) {
  const tier = _huTier(hu);
  if (tier < 0) return 0;
  return 3 + tier;  // 基础分：3, 4, 5, ...
}
// 捉统/自摸完整奖惩
function calcScoreDetail(hu, winType, winnerIdx) {
  const tier = _huTier(hu);
  if (tier < 0) return null;
  // 未放统旁家减分(每人)、放统旁家减分、捉统得分、自摸得分
  const scores = {
    noPenLoss: 2 + tier,     // 未放统旁家每人减分
    penLoss: 3 + tier,       // 放统旁家减分
    zhuoTongGain: 5 + tier * 2,  // 捉统赢家得分
    ziMoGain: 6 + tier * 2       // 自摸赢家得分
  };
  return scores;
}

// ═══════════════════════════════════════════════════
// 庄家胡牌检测（分离预成型melds）
// ═══════════════════════════════════════════════════
// ═══════════════════════════════════════
// 听牌检测：枚举所有字面，模拟摸牌检查能否胡
// ═══════════════════════════════════════
function calcTingChars() {
  // ═══ 收集预成型melds（与 checkDealerSelfHu 完全一致） ═══
  const preMelds = [];
  // 注意: dealerZha时已从handCards移除了扎牌的4张牌，无需再排除
  G.dealerMelds.forEach(m => {
    if (m.inHand) {
      const cards = m.cards || Array.from({length: 4}, () => makeCardData(m.char));
      const actualChars = cards.map(c => c.ch);
      preMelds.push({type: 'zha', chars: actualChars, cards: cards.slice(0, 4)});
    } else {
      const cards = m.cards || Array.from({length: m.count}, () => makeCardData(m.char));
      preMelds.push({type: m.type || 'pen', chars: Array(m.count).fill(m.char), cards});
    }
  });

  // ═══ 自由手牌（扎牌时已从handCards移除，无需再排除） ═══
  const allCards = [...handCards];
  if (G.drawnCard) allCards.push(G.drawnCard);

  const freeCount = allCards.length;
  const preCount = preMelds.reduce((s,m) => s + m.cards.length, 0);
  console.log('[听牌检测] 自由手牌:', freeCount, '预成型牌:', preCount, '总计:', freeCount + preCount,
    'preMelds:', preMelds.map(m => m.type + '(' + m.chars.join('') + ')').join(', '));
  console.log('[听牌检测] 手牌字面:', allCards.map(c => c.ch).join(''));

  // ═══ 统计余牌中每字的可见剩余数量 ═══
  const totalPerChar = {};
  // 每种字总共有5张（精牌3皮2花，非精5皮），赖子2张
  const JING_SET = new Set('三五七乙九');
  for (const ch of '上大人可知礼化三千孔乙己二四五六七八九子十土赖') {
    totalPerChar[ch] = JING_SET.has(ch) ? 5 : 5; // 统一5张
  }
  totalPerChar['赖'] = 2;

  // 减去已知的牌
  function subtractCards(cards) {
    for (const c of cards) {
      const ch = (typeof c === 'string') ? c : c.ch;
      if (totalPerChar[ch] !== undefined) totalPerChar[ch]--;
    }
  }
  // 自由手牌 + 暂存牌
  subtractCards(allCards);
  // 预成型中的牌
  for (const m of preMelds) subtractCards(m.cards);
  // 旁家手牌（不可见但也不在余牌中）
  for (let pi = 1; pi <= 2; pi++) subtractCards(opponentHands[pi] || []);
  // 旁家明牌
  for (let pi = 1; pi <= 2; pi++) {
    for (const m of (opponentMelds[pi] || [])) subtractCards(m.cards);
  }
  // 弃牌池
  document.querySelectorAll('#discard-pool .card').forEach(el => {
    const ch = el.dataset.ch;
    if (ch && totalPerChar[ch] !== undefined) totalPerChar[ch]--;
  });

  // ═══ 枚举所有字面，模拟摸牌 ═══
  const ALL_CHARS = '上大人可知礼化三千孔乙己二四五六七八九子十土'.split('');
  const tingSet = [];

  for (const ch of ALL_CHARS) {
    const card = makeCardData(ch);
    const simCards = [...allCards, card];
    const result = analyzeHand(simCards, preMelds);
    if (result && result.totalHu >= MIN_HU) {
      const remaining = Math.max(0, totalPerChar[ch] || 0);
      console.log('[听牌] ✓ 可胡:', ch, '胡数:', result.totalHu, '余量:', remaining);
      tingSet.push({ ch, totalHu: result.totalHu, remaining });
    }
  }
  // 赖子（不在ALL_CHARS中，单独处理）
  const wildCard = makeCardData(WILD_CHAR);
  const simWild = [...allCards, wildCard];
  const wildResult = analyzeHand(simWild, preMelds);
  if (wildResult && wildResult.totalHu >= MIN_HU) {
    const remaining = Math.max(0, totalPerChar[WILD_CHAR] || 0);
    console.log('[听牌] ✓ 可胡:', WILD_CHAR, '胡数:', wildResult.totalHu, '余量:', remaining);
    tingSet.push({ ch: WILD_CHAR, totalHu: wildResult.totalHu, remaining });
  }

  if (tingSet.length === 0) console.log('[听牌] 未处于听牌状态');
  return tingSet;
}


function updateTingHint() {
  const el = document.getElementById('ting-hint');
  if (!el) return;
  if (G.gameOver || G.locked) {
    el.style.display = 'none';
    return;
  }
  const tingChars = calcTingChars();
  if (tingChars.length === 0) {
    el.style.display = 'none';
    return;
  }
  el.style.display = 'block';
  tingChars.sort((a, b) => SORT_ORDER.indexOf(a.ch) - SORT_ORDER.indexOf(b.ch));
  let html = '<span style="margin-right:8px;color:#ffd700;font-size:13px;">听牌:</span>';
  for (const t of tingChars) {
    const cls = RED_CHARS.has(t.ch) ? 'red' : 'black';
    const remain = t.remaining > 0 ? '<sub style="font-size:10px;color:#aaa;">(' + t.remaining + ')</sub>' : '<sub style="font-size:10px;color:#666;">(0)</sub>';
    html += '<span class="ting-char ' + cls + '">' + t.ch + remain + '</span>';
  }
  el.innerHTML = html;
}


function checkDealerSelfHu() {
  // 收集预成型melds（碰牌/招牌/穿牌/泛牌/扎牌）
  const preMelds = [];
  // 注意: dealerZha时已从handCards移除了扎牌的4张牌，无需再排除
  G.dealerMelds.forEach(m => {
    if (m.inHand) {
      const cards = m.cards || Array.from({length: 4}, () => makeCardData(m.char));
      const actualChars = cards.map(c => c.ch);
      preMelds.push({type: 'zha', chars: actualChars, cards: cards.slice(0, 4)});
    } else {
      const cards = m.cards || Array.from({length: m.count}, () => makeCardData(m.char));
      preMelds.push({type: m.type || 'pen', chars: Array(m.count).fill(m.char), cards});
    }
  });

  // 手牌 + 摸到的牌（扎牌时已从handCards移除，直接使用）
  const allCards = [...handCards];
  if (G.drawnCard) allCards.push(G.drawnCard);

  const result = analyzeHand(allCards, preMelds);
  if (result) {
    const huResult = _calcTotalHu(result.melds, result.mainJin);
    return { ...result, totalHu: huResult.total, breakdown: huResult.breakdown };
  }
  return null;
}

// ── 旁家胡牌检测 ──
function checkOpponentHu(playerIdx) {
  const hand = opponentHands[playerIdx];
  if (hand.length === 0) return false;
  // AI旁家简化检测：纯随机模拟（低概率触发）
  // 后续可接入完整analyzer
  const chars = {};
  hand.forEach(ch => { chars[ch] = (chars[ch]||0)+1; });
  // 检查是否有大量相同字面（暗示可能的坎/招）
  let triplets = 0;
  Object.values(chars).forEach(cnt => { if(cnt>=3) triplets++; });
  // 简化：如果手牌≤8张且有2+组坎，概率胡牌
  if (hand.length <= 8 && triplets >= 2 && Math.random() < 0.15) {
    return true;
  }
  return false;
}

// ── 高亮胡牌组合 ──
function highlightWinCards(melds) {
  cardEls.forEach(el => el.classList.remove('win-highlight'));
  // 匹配melds到cardEls（按字面匹配）
  const used = new Set();
  melds.forEach(m => {
    if (m.type === 'pen') return; // 碰牌在明牌区
    m.chars.forEach(ch => {
      for (let i = 0; i < cardEls.length; i++) {
        if (!used.has(i) && cardEls[i].dataset.ch === ch) {
          used.add(i);
          cardEls[i].classList.add('win-highlight', 'meld-' + m.type);
          break;
        }
      }
    });
  });
}

    var tongChar = G.lastPlayedChar || '';
    var fromPlayer = G.lastPlayedFrom;
    var fromName = fromPlayer >= 0 && fromPlayer <= 2 ? NAMES[fromPlayer] : '旁家';
    var charColor = tongChar ? (RED_CHARS.has(tongChar) ? 'red' : 'black') : '';
    return '  胡<span class="' + charColor + '" style="font-weight:bold;margin:0 4px;">' + tongChar + '</span>  ' + fromName + '放统';
  } else if (winType === '自摸') {
    var drawnCh = G.drawnCard ? G.drawnCard.ch : '';
    if (drawnCh) {
      var cc = drawnCh ? (RED_CHARS.has(drawnCh) ? 'red' : 'black') : '';
      return '  摸<span class="' + cc + '" style="font-weight:bold;margin:0 4px;">' + drawnCh + '</span>';
    }
  }
  return '';
}

// ── 1. 查听牌 ──
function showTingPopup() {
  if (G.gameOver) { _showPopup('查听牌', '<div class="no-settle-msg">本局已结束</div>'); return; }
  const tingResult = detectTing();
  if (!tingResult || !tingResult.tingChars || tingResult.tingChars.length === 0) {
    _showPopup('查听牌', '<div class="no-settle-msg">当前未听牌</div>');
    return;
  }
  // 按胡数从高到低排序
  const sorted = [...tingResult.tingChars].sort((a, b) => (b.hu || b.totalHu) - (a.hu || a.totalHu));
  let charsHtml = '<div class="ting-popup-type">' + (tingResult.tingType || '听牌') + ' — 听 ' + sorted.length + ' 种牌</div>';
  charsHtml += '<div class="ting-popup-chars">';
  sorted.forEach(t => {
    const ch = t.ch;
    const hu = t.hu || t.totalHu || 0;
    const rem = t.remaining !== undefined ? t.remaining : '?';
    const colorClass = (ch === '赖') ? 'gold' : (RED_CHARS.has(ch) ? 'red' : 'black');
    const remClass = rem === 0 ? 'zero' : 'has';
    charsHtml += '<div class="ting-popup-item">' +
      '<span class="ting-popup-ch ' + colorClass + '">' + ch + '</span>' +
      '<span class="ting-popup-hu">' + hu + '胡</span>' +
      '<span class="ting-popup-rem ' + remClass + '">余' + rem + '</span>' +
      '</div>';
  });
  charsHtml += '</div>';
  _showPopup('查听牌', charsHtml);
}

  let html = '';

    html = '<div class="no-settle-msg">暂无对局记录</div>';
  } else {
    html += '<table class="record-table"><thead><tr>' +
      '<th>局</th><th>结果</th><th>胡数</th><th>方式</th><th>赢家</th><th>庄家分</th></tr></thead><tbody>';
    _gameStats.records.forEach(r => {
      const cls = r.score > 0 ? 'win' : (r.score < 0 ? 'lose' : '');
      const scoreText = r.score > 0 ? ('+' + r.score) : String(r.score);
      html += '<tr>' +
        '<td>' + r.gameNo + '</td>' +
        '<td class="' + cls + '">' + r.result + '</td>' +
        '<td>' + (r.hu || '-') + '</td>' +
        '<td>' + (r.winType || '-') + '</td>' +
        '<td>' + (r.winner || '-') + '</td>' +
        '<td class="' + cls + '">' + scoreText + '</td></tr>';
    });
    html += '</tbody></table>';
  }
  // 汇总
  const totalWin = _gameStats.totalScore;
  const totalCls = totalWin > 0 ? 'total-win' : (totalWin < 0 ? 'total-lose' : 'total-even');
  const totalText = totalWin > 0 ? ('+' + totalWin) : String(totalWin);
  html += '<div class="record-summary">' +

    '<div style="margin-top:8px;">庄家总盈亏: <span class="' + totalCls + '">' + totalText + ' 分</span></div>' +
    '</div>';
  _showPopup('战绩统计', html);
}

function showSettlePanel(winnerIdx, winResult, winType) {
  const container = document.getElementById('settle-container');
  const name = NAMES[winnerIdx];
  const points = calcPoints(winResult.totalHu);

  let meldsHtml = '';
  winResult.melds.forEach(m => {
    const cardsHtml = (m.cards || m.chars.map(ch => makeCardData(ch))).map(c => {
      const color = charColor(c.ch);
      const wildClass = c.isWild ? ' wild-in-meld' : '';
      const flowerClass = c.v === 'flower' ? ' mini-flower' : '';
      const isJing = c.isJin && !c.isWild;
      const fpTag = isJing ? (c.v === 'flower' ? '<sup style="font-size:8px;color:#bf9b30;position:absolute;top:1px;right:2px;">花</sup>' : '<sup style="font-size:8px;color:#888;position:absolute;top:1px;right:2px;">皮</sup>') : '';
      return '<span class="mini-card ' + color + wildClass + flowerClass + '" style="position:relative;">' + c.ch + fpTag + '</span>';
    }).join('');
    meldsHtml += '<div class="settle-meld-group">' +
      '<div class="settle-meld-label">' + _meldLabel(m.type) + '</div>' +
      cardsHtml + '</div>';
  });

  let breakdownHtml = '';
  if (winResult.breakdown) {
    winResult.breakdown.forEach(b => {
      breakdownHtml += '<div class="settle-hu-row">' +
        '<span class="hu-label">' + b.label + ' (' + b.chars + ')</span>' +
        '<span class="hu-val">+' + b.hu + '胡</span></div>';
    });
  }

  // 计算奖惩明细
  const sd = calcScoreDetail(winResult.totalHu, winType, winnerIdx);
  let scoreHtml = '';
  if (sd) {
    scoreHtml = '<div class="settle-score-detail">';
    if (winType === '自摸') {
      scoreHtml += '<div class="score-row winner">' + name + '（自摸）+' + sd.ziMoGain + '分</div>';
      for (var si = 1; si <= 2; si++) {
        scoreHtml += '<div class="score-row loser">' + NAMES[si] + ' -' + sd.noPenLoss + '分</div>';
      }
    } else {
      // 捉统：放统者额外惩罚
      var penPlayer = G.lastPlayedFrom;
      var penName = penPlayer >= 0 && penPlayer <= 2 ? NAMES[penPlayer] : '旁家';
      scoreHtml += '<div class="score-row winner">' + name + '（捉统）+' + sd.zhuoTongGain + '分</div>';
      scoreHtml += '<div class="score-row loser">' + penName + '（放统）-' + sd.penLoss + '分</div>';
      for (var si = 1; si <= 2; si++) {
        if (si !== penPlayer) {
          scoreHtml += '<div class="score-row loser">' + NAMES[si] + ' -' + sd.noPenLoss + '分</div>';
        }
      }
    }
    scoreHtml += '</div>';
  }

  // 保存结算HTML(用于工具栏查看)
  var mjText = winResult.mainJin ? ('主精: <span style="color:' + (RED_CHARS.has(winResult.mainJin) ? '#dc2626' : '#1a1a1a') + ';font-weight:bold;">' + winResult.mainJin + '</span>') : '无主精';
  var settleContent = '<div class="settle-title">胡 牌</div>' +
    '<div class="settle-winner" style="margin-bottom:8px;">' + mjText + '</div>' +
    '<div class="settle-winner">' + name + ' ' + winType + _huDetailHtml(winType) + '</div>' +
    '<div class="settle-melds">' + meldsHtml + '</div>' +
    '<div class="settle-hu-breakdown">' + breakdownHtml + '</div>' +
    '<div class="settle-total">' + winResult.totalHu + '胡 = ' + points + '分</div>' +
    scoreHtml;
  _gameStats.lastSettleHtml = settleContent;

  // 更新状态栏主精显示
  var mjDisplay = document.getElementById('main-jin-display');
  var sjDisplay = document.getElementById('sub-jin-display');
  if (mjDisplay) {
    if (winResult.mainJin) {
      var mjColor = RED_CHARS.has(winResult.mainJin) ? 'var(--red)' : 'var(--black)';
      mjDisplay.innerHTML = '<span style="color:' + mjColor + ';font-weight:bold;">' + winResult.mainJin + '</span>(主精)';
    } else {
      mjDisplay.textContent = '无';
    }
  }
  // 副精: 显示除主精外的其他精牌
  if (sjDisplay) {
    var otherJing = [];
    var allJingInMelds = new Set();
    (winResult.melds || []).forEach(function(m) { (m.cards || []).forEach(function(c) { if (c.isJin && !c.isWild) allJingInMelds.add(c.ch); }); });
    allJingInMelds.forEach(function(ch) { if (ch !== winResult.mainJin) otherJing.push(ch); });
    sjDisplay.textContent = otherJing.length > 0 ? otherJing.join('/') : '无';
  }

  // 更新统计
  _gameStats.totalGames++;
  var dealerScore = 0;
  if (winnerIdx === 0) {
    _gameStats.wins++;
    dealerScore = (winType === '自摸') ? (sd ? sd.ziMoGain : 0) : (sd ? sd.zhuoTongGain : 0);
  } else {
    _gameStats.losses++;
    dealerScore = -((winType === '自摸') ? (sd ? sd.noPenLoss : 2) : (sd ? sd.noPenLoss : 2));
    if (G.lastPlayedFrom === 0) {
      dealerScore = -(sd ? sd.penLoss : 3);
    }
  }
  _gameStats.totalScore += dealerScore;
  _gameStats.records.push({
    gameNo: _gameStats.totalGames,
    result: winnerIdx === 0 ? '胜' : '负',
    hu: winResult.totalHu,
    winType: winType,
    winner: name,
    score: dealerScore
  });

  container.innerHTML = '<div class="settle-overlay" onclick="this.remove()">' +
    '<div class="settle-panel" onclick="event.stopPropagation()">' +
    settleContent +
    '<button class="settle-restart-btn" onclick="closeSettle(); restartGame();">再来一局</button>' +
    '</div></div>';
}

// 覆盖 passToNext：庄家摸牌后检测自摸
const _origPassToNext = passToNext;
passToNext = function(fromIdx) {
  console.log("[流程] passToNext, from=" + fromIdx + ", deckCount=" + G.deckCount);
  if (G.gameOver) return;
  const next = (fromIdx + 1) % 3;

  if (next === 0) {
    if (G.deckCount <= 0) { endGame(); return; }
    const drawnCh = G.deck.pop();
    G.deckCount--;
    const data = parseDeckCard(drawnCh);

    addLog(NAMES[0], '摸牌', drawnCh.indexOf(':')>=0 ? drawnCh.substring(0,drawnCh.indexOf(':')) : drawnCh);
    setPhase('庄家摸牌中');

    animateDealerDraw(data, () => {
      // ★ 庄家重新获得操作权，清除过牌记录
      G._skippedOps = {};
      // 摸牌后检测自摸和扎牌（同时检测，均满足时都给按钮）
      if (checkDealerZhaAndHu()) return;

      setPhase('庄家出牌');
      G.phase = 'play';
      unlockHand();
      updateUI();
    });
  } else {
    if (G.deckCount <= 0) { endGame(); return; }
    setPhase(NAMES[next] + '摸牌出牌中');
    setTimeout(() => opponentAutoPlay(next), 800);
  }
};

// 覆盖 checkResponseAfterOpponent：检测庄家胡
const _origCheckResponse = checkResponseAfterOpponent;
checkResponseAfterOpponent = function(fromIdx) {
  console.log("[流程] checkResponseAfterOpponent, from=" + fromIdx + ", char=" + G.lastPlayedChar);
  const ch = G.lastPlayedChar;
  // 旁家操作期间，允许玩家拖拽手牌整理
  lockHandForOpponent();

  // 0. 检查庄家是否可胡（捉统/吃牌胡）
  var canHu = false;
  const testCards = [...handCards];
  if (G.drawnCard) testCards.push(G.drawnCard);
  testCards.push(Object.assign(makeCardData(ch), {isTongCard: true}));
  // 构建预组牌（已有碰/招/扎/穿/泛），inHand扎牌作为zha计入preMelds并排除锁定牌
  const dealerPreMelds = [];
  (G.dealerMelds || []).forEach(m => {
    if (m.inHand) {
      const cd = m.cards || Array.from({length: 4}, () => makeCardData(m.char));
      const actualChars = cd.map(c => c.ch);
      dealerPreMelds.push({type: 'zha', chars: actualChars, cards: cd.slice(0, 4)});
    } else {
      const cd = m.cards || Array.from({length: m.count}, () => makeCardData(m.char));
      dealerPreMelds.push({type: m.type || 'pen', chars: Array(m.count).fill(m.char), cards: cd});
    }
  });
  const filteredTestCards = testCards;

  // ★ 自由拆分（统牌已标记isTongCard，_partition会将含统牌的坎牌自动转为碰牌）
  const huResult = analyzeHand(filteredTestCards, dealerPreMelds);
  if (huResult) {
    const huDetail = _calcTotalHu(huResult.melds, huResult.mainJin);
    huResult.totalHu = huDetail.total;
    huResult.breakdown = huDetail.breakdown;
    console.log('[流程] 庄家可胡牌! ' + huDetail.total + '胡');
    G._pendingWin = { ...huResult, winType: '捉统' };
    canHu = true;
  }

  // 1. 检查庄家是否可碰或可招
  const dealerCount = handCards.filter(c => c.ch === ch).length;
  const drawnMatch = G.drawnCard && G.drawnCard.ch === ch ? 1 : 0;
  const totalCount = dealerCount + drawnMatch;
  var canZhao = totalCount >= 3;
  var canPen = totalCount >= 2;

  // ★ 限两对：胡牌前最多两次碰牌机会
  var penCount = G.dealerMelds ? G.dealerMelds.filter(m => m.type === 'pen').length : 0;
  if (canPen && penCount >= 2) canPen = false;

  // ★ 检查过牌记录，丧失已放弃的操作权
  if (canPen && G._skippedOps['pen_' + ch]) canPen = false;
  if (canZhao && G._skippedOps['zhao_' + ch]) canZhao = false;
  if (canHu && G._skippedOps['hu']) canHu = false;
  
  // 统一显示所有可用按钮（扣除已过牌的操作）
      hideTingPanel();
  if (canHu || canZhao || canPen) {
    setPhase(canHu ? '庄家可胡牌' : (canZhao ? '等待你碰/招牌' : '等待你碰牌'));
    actionsDealer.classList.add('show');
    document.getElementById('btn-hu').style.display = canHu ? '' : 'none';
    document.getElementById('btn-fan').style.display = 'none';
    document.getElementById('btn-chuan').style.display = 'none';
    document.getElementById('btn-zhao').style.display = canZhao ? '' : 'none';
    document.getElementById('btn-pen').style.display = canPen ? '' : 'none';
    document.getElementById('btn-pass').style.display = '';
    document.getElementById('btn-zha').style.display = 'none';
    return;
  }

  // 2. 检查另一个旁家
  const otherPlayers = [1, 2].filter(p => p !== fromIdx);
  for (const pi of otherPlayers) {
    const count = opponentHands[pi].filter(c => c === ch).length;
    var hasZha = false;
    for (var mi = 0; mi < opponentMelds[pi].length; mi++) {
      if (opponentMelds[pi][mi].type === 'zha' && opponentMelds[pi][mi].cards[0] === ch) {
        hasZha = true; break;
      }
    }
    if (count >= 2) {
      if (hasZha) {
        addLog(NAMES[pi], '泛', ch);
        opponentFan(pi, ch);
        return;
      }
      addLog(NAMES[pi], '碰', ch);
      setPhase(NAMES[pi] + '碰牌中');
      setTimeout(() => opponentPen(pi, ch), 800);
      return;
    }
  }

  // 3. 都不碰 → 流转
  setTimeout(() => passToNext(fromIdx), 400);
};

// 修改opponentAutoPlay：旁家出牌后检测旁家自摸
const _origOpponentAutoPlay = opponentAutoPlay;
opponentAutoPlay = function(playerIdx) {
  console.log("[流程] opponentAutoPlay, player=" + playerIdx);
  if (G.gameOver) return;
  const hand = opponentHands[playerIdx];
  if (hand.length === 0) return;

  if (G.deckCount > 0) {
    var ds = G.deck.pop(); hand.push(ds.indexOf(':') >= 0 ? ds.substring(0, ds.indexOf(':')) : ds);
    G.deckCount--;
  } else { endGame(); return; }

  // 旁家摸牌后检测扎牌（4张同字暗杠）
  const oppCounts = {};
  for (const c of hand) oppCounts[c] = (oppCounts[c] || 0) + 1;
  let zhaChar = null;
  for (const c in oppCounts) { if (oppCounts[c] >= 4) { zhaChar = c; break; } }
  if (zhaChar) {
    // 执行扎牌
    for (let i = hand.length - 1; i >= 0; i--) {
      if (hand[i] === zhaChar) hand.splice(i, 1);
    }
    opponentMelds[playerIdx].push({ type: 'zha', cards: [zhaChar,zhaChar,zhaChar,zhaChar] });
    addOpponentMeld(playerIdx, 'zha', zhaChar);
    updateOpponentCounts();
    addLog(NAMES[playerIdx], '扎', zhaChar);

    // 扎牌后摸牌底
    if (G.deckCount > 0) {
      var ds2 = G.deck.shift(); hand.push(ds2.indexOf(':') >= 0 ? ds2.substring(0, ds2.indexOf(':')) : ds2);
      G.deckCount--;
      addLog(NAMES[playerIdx], '扎后摸牌', '');
    }
  }

  // 旁家摸牌后检测穿牌（扎牌+手中/摸到同字→穿牌）
  for (let mi2 = opponentMelds[playerIdx].length - 1; mi2 >= 0; mi2--) {
    if (opponentMelds[playerIdx][mi2].type === 'zha') {
      const zhaCh2 = opponentMelds[playerIdx][mi2].cards[0];
      const hc2 = hand.filter(c => c === zhaCh2).length;
      if (hc2 >= 1) {
        opponentChuan(playerIdx, zhaCh2);
        return;
      }
    }
  }

  const playIdx = aiPickDiscard(hand);
  const played = hand.splice(playIdx, 1)[0];
  addLog(NAMES[playerIdx], '出', played);
  setPhase(NAMES[playerIdx] + '出牌中');
  G.lastPlayedChar = played;
  G.lastPlayedFrom = playerIdx;
  addDiscardCard(played, charColor(played), charVariant(played));
  updateOpponentCounts();

  setTimeout(() => checkResponseAfterOpponent(playerIdx), 500);
};

// Step6: 听牌判定与提示
// ═══════════════════════════════════════════════════

var ALL_22_CHARS = ['上','大','人','可','知','礼','三','五','七',
  '化','千','孔','己','二','四','六','八','十','子','土','乙','九','赖'];

// 检测庄家当前手牌听哪些牌（不包括已摸到的牌）
// 返回: { tingChars: [{ch, hu, type}], tingType: '两听'|'摞听'|null }
function detectTing() {
  const cards = [...handCards];
  if (G.drawnCard) cards.push(G.drawnCard);
  const preMelds = [];
  (G.dealerMelds || []).forEach(m => {
    if (m.inHand) {
      const cd = m.cards || Array.from({length: 4}, () => makeCardData(m.char));
      const actualChars = cd.map(c => c.ch);
      preMelds.push({type: 'zha', chars: actualChars, cards: cd.slice(0, 4)});
    } else {
      const cd = m.cards || Array.from({length: m.count}, () => makeCardData(m.char));
      preMelds.push({type: m.type || 'pen', chars: Array(m.count).fill(m.char), cards: cd});
    }
  });

  // ═══ 统计余牌中每字的可见剩余数量 ═══
  const totalPerChar = {};
  for (const ch of '上大人可知礼化三千孔乙己二四五六七八九子十土赖') {
    totalPerChar[ch] = (ch === '赖') ? 2 : 5;
  }
  function subtractCards(cardList) {
    for (const c of cardList) {
      const ch = (typeof c === 'string') ? c : c.ch;
      if (totalPerChar[ch] !== undefined) totalPerChar[ch]--;
    }
  }
  subtractCards(cards);
  for (const m of preMelds) subtractCards(m.cards);
  for (let pi = 1; pi <= 2; pi++) subtractCards(opponentHands[pi] || []);
  for (let pi = 1; pi <= 2; pi++) {
    for (const m of (opponentMelds[pi] || [])) subtractCards(m.cards);
  }
  document.querySelectorAll('#discard-pool .card').forEach(el => {
    const ch = el.dataset.ch;
    if (ch && totalPerChar[ch] !== undefined) totalPerChar[ch]--;
  });

  // ═══ 枚举所有字面，模拟摸牌 ═══
  const tingChars = [];
  for (const ch of ALL_22_CHARS) {
    const testCard = makeCardData(ch);
    const testCards = [...cards, testCard];
    const result = analyzeHand(testCards, preMelds);
    if (result && result.totalHu >= MIN_HU) {
      const remaining = Math.max(0, totalPerChar[ch] || 0);
      tingChars.push({ch, hu: result.totalHu, remaining});
    }
  }
  // 赖子单独检测
  const wildCard = makeCardData(WILD_CHAR);
  const simWild = [...cards, wildCard];
  const wildResult = analyzeHand(simWild, preMelds);
  if (wildResult && wildResult.totalHu >= MIN_HU) {
    const remaining = Math.max(0, totalPerChar[WILD_CHAR] || 0);
    tingChars.push({ch: WILD_CHAR, hu: wildResult.totalHu, remaining});
  }

  // 判定听牌类型
  let tingType = null;
  var meldExtra = 0;
  (G.dealerMelds || []).forEach(m => {
    var cnt = m.count || 3;
    if (cnt === 3) meldExtra += 2;
    else if (cnt === 4) meldExtra += (m.type === 'zha' ? 3 : 2);
    else if (cnt === 5) meldExtra += (m.type === 'chuan' ? 3 : 2);
  });
  var expectedLen = 25 - meldExtra;
  if (cards.length === expectedLen) tingType = '两听';
  else if (cards.length === expectedLen - 1) tingType = '摞听';

  return {tingChars, tingType};
}

// ═══════════════════════════════════════════════════
// Step 7: 旁家AI智能出牌策略（降低流局率）
// ═══════════════════════════════════════════════════

/**
 * 旁家AI选择出牌 — 基于牌型价值评分
 *
 * 策略优先级（从低到高分 = 不打出）：
 *   - 分数 0: 孤立单张（无顺子关联、无双张）
 *   - 分数 1: 仅参与一个口（半顺子），无对子
 *   - 分数 2: 仅有一个对子，无顺子关联
 *   - 分数 3: 参与两个或更多口/顺子关联
 *   - 分数 4: 双张且参与顺子关联
 *   - 分数 5: 三张（坎牌候选）
 *   - 分数 8: 精牌（三/五/七/乙/九）额外加分
 *
 * 同分时：出字面在SORT_ORDER中排最后的（数字大或关联少的字优先出）
 *
 * @param {string[]} hand - 旁家手牌字面数组
 * @returns {number} 要打出的牌在hand中的索引
 */
function aiPickDiscard(hand) {
  if (hand.length === 0) return -1;
  if (hand.length === 1) return 0;

  // 1. 统计各字出现次数
  const counts = {};
  for (const ch of hand) {
    counts[ch] = (counts[ch] || 0) + 1;
  }

  // 2. 统计各字参与的口数量（在手牌中能形成的半顺子组合）
  const kouCount = {};
  for (const [ch1, ch2] of ALL_KOU_LIST) {
    if ((counts[ch1] || 0) > 0 && (counts[ch2] || 0) > 0) {
      kouCount[ch1] = (kouCount[ch1] || 0) + 1;
      kouCount[ch2] = (kouCount[ch2] || 0) + 1;
    }
  }

  // 3. 统计各字可参与的完整顺子数量（手牌中有全部3张的顺子）
  const seqComplete = {};
  for (const seq of ALL_SEQS) {
    if (seq.every(ch => (counts[ch] || 0) > 0)) {
      for (const ch of seq) {
        seqComplete[ch] = (seqComplete[ch] || 0) + 1;
      }
    }
  }

  // 4. 统计各字可参与但缺一张的顺子数量（差一张就完整）
  const seqNear = {};
  for (const seq of ALL_SEQS) {
    let has = 0, missing = 0;
    for (const ch of seq) {
      if ((counts[ch] || 0) > 0) has++;
      else missing++;
    }
    if (missing === 1 && has === 2) {
      for (const ch of seq) {
        if ((counts[ch] || 0) > 0) {
          seqNear[ch] = (seqNear[ch] || 0) + 1;
        }
      }
    }
  }

  // 5. 为每张牌计算价值评分
  const scores = hand.map((ch, idx) => {
    const cnt = counts[ch];
    const kou = kouCount[ch] || 0;
    const seqC = seqComplete[ch] || 0;
    const seqN = seqNear[ch] || 0;
    const isJing = JING_CHARS.has(ch);

    let score = 0;

    // 孤立单张：无口、无双张
    if (cnt === 1 && kou === 0) {
      score = 0;
    }
    // 仅参与口，无双张
    else if (cnt === 1 && kou > 0) {
      score = 1 + Math.min(kou - 1, 2); // 参与更多口更有价值
    }
    // 对子，无顺子关联
    else if (cnt === 2 && kou === 0) {
      score = 2;
    }
    // 对子，有顺子关联
    else if (cnt === 2 && kou > 0) {
      score = 3 + Math.min(kou - 1, 2);
      // 如果差一张就凑成顺子，额外加分
      if (seqN > 0) score += seqN;
    }
    // 三张（坎牌候选）
    else if (cnt >= 3) {
      score = 5 + (kou > 0 ? 1 : 0);
    }
    // 默认（安全兜底）
    else {
      score = 1;
    }

    // 赖子加分：全幅仅2张，可通配三五七凑胡，实战中绝不轻出
    // 给赖子远超普通精牌的保留权重，使其几乎不会被优先打出
    if (ch === '赖') {
      // 基础保留分 = 50（远高于任何普通牌的最高评分~13）
      score += 50;
      // 赖子+三五七在手越多，赖子越有价值（通配选择更灵活）
      const san357 = (counts['三']||0) + (counts['五']||0) + (counts['七']||0);
      if (san357 >= 2) score += 10;
      else if (san357 >= 1) score += 5;
    }
    // 精牌加分：精牌用于凑胡更关键，不应轻易打出
    else if (isJing) {
      score += 3;
    }

    // 完整顺子加分
    if (seqC > 0) score += seqC * 2;

    // 字面排序因子：SORT_ORDER中排越后的越先出（打破同分平局）
    // SORT_ORDER = '上大人可知礼三化千孔乙己二四五六七八九十子土赖'
    const orderFactor = SORT_ORDER.indexOf(ch);

    return { idx, ch, score, orderFactor, cnt };
  });

  // 6. 排序：分数从低到高，同分时orderFactor从大到小
  scores.sort((a, b) => {
    if (a.score !== b.score) return a.score - b.score;
    return b.orderFactor - a.orderFactor;
  });

  // 7. 返回价值最低的牌的索引
  return scores[0].idx;
}

initGame();
