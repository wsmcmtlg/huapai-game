<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>公安花牌 - Step4 摸牌与完整回合</title>
<style>
  :root {
    --table-bg: #1a472a;
    --table-felt: #2d6a3f;
    --card-bg: #f5f0e1;
    --card-shadow: rgba(0,0,0,0.3);
    --red: #b91c1c;
    --black: #1a1a1a;
    --gold: #b8860b;
    --gold-light: #daa520;
    --radius: 5px;
    --font-cn: "KaiTi", "STKaiti", "FangSong", serif;
    --font-display: "Noto Serif SC", "SimSun", serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 100vw; height: 100vh; overflow: hidden;
    background: var(--table-bg);
    background-image: radial-gradient(ellipse at 50% 50%, var(--table-felt) 0%, var(--table-bg) 75%);
    font-family: var(--font-cn);
    color: #e8e0d0;
  }
  .table { width: 100%; height: 100%; position: relative; }

  /* ═══════ 牌面 ═══════ */
  .card {
    width: 40px; height: 56px; background: var(--card-bg);
    border-radius: var(--radius); border: 1px solid #d4c9a8;
    display: inline-flex; flex-direction: column; align-items: center; justify-content: center;
    position: absolute; cursor: default;
    box-shadow: 0 1px 3px var(--card-shadow), inset 0 1px 0 rgba(255,255,255,0.5);
    user-select: none; z-index: 1;
  }
  .card::before {
    content: ""; position: absolute; inset: 2px;
    border: 0.5px solid rgba(180,160,120,0.25); border-radius: 3px; pointer-events: none;
  }
  /* ═══════ 花精/皮精视觉区分 ═══════ */
  /* 花精：金色内边框装饰 + 暖色底纹 */
  .card.v-flower {
    border-color: #bf9b30;
    background: linear-gradient(180deg, #fdf6e3 0%, #f5e6c8 100%);
  }
  .card.v-flower::before {
    content: ""; position: absolute; inset: 2px;
    border: 2.5px solid rgba(191,155,48,0.7);
    border-radius: 2px;
    pointer-events: none;
  }
  /* 花精精牌额外装饰：虚线内框 */
  .card.v-flower.hua-mei::before,
  .card.v-flower.hua-lan::before,
  .card.v-flower.hua-zhu::before,
  .card.v-flower.hua-xia::before,
  .card.v-flower.hua-dong::before {
    border: 2px dashed rgba(191,155,48,0.8);
    inset: 2px;
  }
  .card-char { font-size: 20px; font-weight: 700; font-family: var(--font-display); line-height: 1; }
  .card-char.red   { color: var(--red); }
  .card-char.black { color: var(--black); }
  /* 花精底纹 — 梅(三)、兰(五)、竹(七) */
  .card.hua-mei { background: linear-gradient(160deg, #fff0f3 0%, #fce7f3 40%, #fbcfe8 100%); border-color: #ec4899; }
  .card.hua-mei::after { content: ""; position: absolute; inset: 0; background: url('mei.png') center/contain no-repeat; opacity: 0.18; border-radius: 4px; pointer-events: none; }
  .card.hua-lan { background: linear-gradient(160deg, #eff6ff 0%, #dbeafe 40%, #bfdbfe 100%); border-color: #3b82f6; }
  .card.hua-lan::after { content: ""; position: absolute; inset: 0; background: url('lan.png') center/contain no-repeat; opacity: 0.18; border-radius: 4px; pointer-events: none; }
  .card.hua-zhu { background: linear-gradient(160deg, #f0fdf4 0%, #dcfce7 40%, #bbf7d0 100%); border-color: #22c55e; }
  .card.hua-zhu::after { content: ""; position: absolute; inset: 0; background: url('zhu.png') center/contain no-repeat; opacity: 0.18; border-radius: 4px; pointer-events: none; }
  /* 花精底纹 — 夏(乙)、冬(九) */
  .card.hua-xia { background: linear-gradient(160deg, #fffbeb 0%, #fef3c7 40%, #fde68a 100%); border-color: #e5b84c; }
  .card.hua-xia::after { content: ""; position: absolute; inset: 0; background: url('xia.png') center/contain no-repeat; opacity: 0.18; border-radius: 4px; pointer-events: none; }
  .card.hua-dong { background: linear-gradient(160deg, #f8fafc 0%, #e2e8f0 40%, #cbd5e1 100%); border-color: #94a3b8; }
  .card.hua-dong::after { content: ""; position: absolute; inset: 0; background: url('dong.png') center/contain no-repeat; opacity: 0.18; border-radius: 4px; pointer-events: none; }
  .card.laizi {
    background: linear-gradient(160deg, #fef3c7 0%, #fde68a 50%, #fbbf24 100%);
    border-color: var(--gold);
  }
  .card.laizi::after { content: ""; position: absolute; inset: 0; background: url('ju.png') center/contain no-repeat; opacity: 0.22; border-radius: 4px; pointer-events: none; }
  .card.laizi .card-char {
    background: linear-gradient(180deg, var(--red), var(--gold));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text; font-size: 22px;
  }
  .card-back { background: linear-gradient(135deg, #7c3aed, #4c1d95); border-color: #5b21b6; }
  .card-back::before { border-color: rgba(167,139,250,0.3); }
  .card-back-text { font-size: 14px; color: rgba(255,255,255,0.3); font-family: var(--font-display); }

  .card.in-hand { cursor: grab; }
  .card.in-hand.locked { cursor: not-allowed; opacity: 0.7; pointer-events: none; }

  /* 扎牌在手牌区的样式 - 细边框标记+锁死 */
  .card.in-hand.zha-locked {
    border: 2px solid var(--gold, #d4a857);
    box-shadow: 0 0 6px rgba(212, 168, 87, 0.5);
    cursor: not-allowed !important;
    pointer-events: none;
    opacity: 0.9;
  }
  .card.in-hand.zha-locked .card-char::after {
    content: '';
    position: absolute;
    bottom: -1px; left: 2px; right: 2px;
    height: 2px;
    background: var(--gold, #d4a857);
    border-radius: 0 0 2px 2px;
  }



  /* 旁家操作时: 手牌可整理，但不可出牌（通过playCard中的检查控制） */
  .hand-zone.btns-locked .card.in-hand:not(.zha-locked) {
    cursor: grab;
    pointer-events: auto;
    opacity: 1;
  }
  .hand-zone.btns-locked .card.in-hand:not(.zha-locked):hover {
    box-shadow: 0 4px 12px var(--card-shadow);
    z-index: 5;
  }
  /* btns-locked模式下隐藏提示 */
  .hand-zone.btns-locked .hand-zone-hint {
    display: none;
  }


  .card.in-hand:not(.locked):hover { box-shadow: 0 4px 12px var(--card-shadow); z-index: 5; }
  .card.in-hand:active { cursor: grabbing; }
  .card.dragging { z-index: 100; box-shadow: 0 8px 24px rgba(0,0,0,0.5); transform: scale(1.06); cursor: grabbing; }
  .card.grouped { box-shadow: 0 0 0 2px rgba(59,130,246,0.6), 0 2px 8px var(--card-shadow); }

  .card.flying { position: fixed !important; z-index: 200; transition: all 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94); pointer-events: none; }
  .card.just-played { box-shadow: 0 0 0 2px #fbbf24, 0 0 12px rgba(251,191,36,0.4); z-index: 2; }

  /* 摸牌入场动画 */
  .card.draw-anim {
    position: fixed !important; z-index: 200;
    transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    pointer-events: none;
  }
  @keyframes drawGlow {
    0%,100% { box-shadow: 0 0 8px rgba(251,191,36,0.3); }
    50% { box-shadow: 0 0 20px rgba(251,191,36,0.7), 0 0 40px rgba(251,191,36,0.3); }
  }
  .card.just-drawn {
    animation: drawGlow 0.6s ease-in-out 2;
    box-shadow: 0 0 0 2px #fbbf24, 0 0 12px rgba(251,191,36,0.4);
    z-index: 10;
  }

  /* 余牌堆发牌动画 */
  .card.deck-fly {
    position: fixed !important; z-index: 200;
    transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    pointer-events: none;
  }

  /* 明牌组 */
  .meld-group {
    display: inline-flex; gap: 2px; padding: 4px 6px;
    background: rgba(0,0,0,0.12); border-radius: 6px;
    border: 1px dashed rgba(255,255,255,0.06);
  }
  .meld-group .card { position: relative; cursor: default; width: 32px; height: 44px; }
  .meld-group .card .card-char { font-size: 16px; }
  .meld-group .card + .card { margin-left: 2px; }
  .meld-group .card.open-pen::after,
  .meld-group .card.open-zhao::after {
    content: ""; position: absolute; bottom: -3px; left: 3px; right: 3px;
    height: 3px; border-radius: 0 0 4px 4px;
  }
  .meld-group .card.open-pen::after  { background: #22c55e; }
  .meld-group .card.open-zhao::after { background: #3b82f6; }

  /* 扎牌（暗杠）样式 - 横放 */
  .meld-group .card.hidden-kan {
    width: 22px; height: 32px; font-size: 10px;
    background: linear-gradient(135deg, #e8e0c8 0%, #d4c8a8 100%);
    border: 1px solid #b0a080;
    display: inline-flex; align-items: center; justify-content: center;
  }
  /* 穿牌（明杠+补牌）样式 */
  .meld-group .card.chuan-extra {
    border: 2px dashed var(--gold);
    margin-left: -8px;
  }
  /* 泛牌（暗杠+补牌）样式 - 4暗+1补 */
  .meld-group .card.fan-extra {
    border: 2px dashed #888;
    margin-left: -8px;
  }
  .meld-label {
    font-size: 9px; text-align: center; margin-top: 1px;
    color: #999; white-space: nowrap;
  }

  .melds-col { display: flex; flex-direction: column; gap: 5px; }

  /* ═══════ 庄家手牌区 ═══════ */
  .hand-zone {
    position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
    width: 70vw; height: 160px;
    background: rgba(234,179,8,0.06);
    border: 1px dashed rgba(234,179,8,0.15);
    border-radius: 8px; overflow: visible;
  }
  .hand-zone-hint {
    position: absolute; top: 4px; left: 10px;
    font-size: 10px; color: rgba(234,179,8,0.35); pointer-events: none;
  }
  .hand-zone.locked { border-color: rgba(234,179,8,0.08); background: rgba(234,179,8,0.02); }

  /* ═══════ 其它区域 ═══════ */
  .z-deck {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 8px;
    background: rgba(0,0,0,0.3); padding: 6px 14px; border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.06); z-index: 15;
  }
  .draw-pile { display: flex; gap: 1px; }
  .draw-pile .card { width: 28px; height: 40px; position: relative; }
  .draw-pile .card-back-text { font-size: 10px; }
  .draw-count { font-size: 13px; color: var(--gold-light); font-weight: 600; }

  .z-discard {
    position: absolute; top: 38%; left: 50%; transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.1); border-radius: 10px;
    border: 1px dashed rgba(255,255,255,0.08);
    padding: 8px 10px; display: flex; flex-wrap: wrap; gap: 1px; align-content: flex-start;
    z-index: 5; min-width: 80px; min-height: 50px;
  }
  .z-discard .card { width: 30px; height: 42px; position: relative; margin: 1px; }
  .z-discard .card-char { font-size: 15px; }

  .z-game-status {
    position: absolute; top: 12px; left: 15%;
    background: rgba(0,0,0,0.45); backdrop-filter: blur(6px);
    padding: 10px 14px; border-radius: 8px;
    font-size: 12px; line-height: 1.8;
    border: 1px solid rgba(255,255,255,0.08);
    z-index: 20; min-width: 140px;
  }
  .z-game-status .label { color: rgba(245,240,225,0.45); }
  .z-game-status .val { color: var(--gold-light); font-weight: 600; }
  .z-game-status .val.waiting { color: #ef4444; animation: blink 1s step-end infinite; }
  .z-game-status .val.drawing { color: #22c55e; }
  @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.5;} }

  .log-bar {
    position: absolute; top: 12px; right: 15%;
    background: rgba(0,0,0,0.45); backdrop-filter: blur(6px);
    padding: 6px 12px; border-radius: 8px;
    font-size: 11px; line-height: 1.6;
    border: 1px solid rgba(255,255,255,0.08);
    z-index: 20; max-width: 200px; color: rgba(245,240,225,0.6);
  }
  .log-bar .log-title { font-weight: 700; color: var(--gold-light); font-size: 11px; margin-bottom: 2px; }
  .log-bar .log-item { padding: 1px 0; }
  .log-bar .log-who { color: rgba(245,240,225,0.8); font-weight: 600; }
  .log-bar .log-act { color: var(--gold-light); }

  .player-info {
    position: absolute;
    background: rgba(0,0,0,0.45); backdrop-filter: blur(6px);
    padding: 8px 12px; border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.08);
    z-index: 15; font-size: 12px; line-height: 1.6;
  }
  .player-info .p-name { font-weight: 700; color: #e8e0d0; }
  .player-info .p-stats { color: rgba(245,240,225,0.5); font-size: 11px; }
  .player-info .p-stats span { color: var(--gold-light); font-weight: 600; }
  .player-info.active { border-color: var(--gold); }
  .player-info.active .p-name { color: var(--gold-light); }

  .side-hand-zone {
    position: absolute; width: 150px; height: 340px;
    display: flex; align-items: center; justify-content: center; z-index: 10;
  }
  .side-hand-zone .hand { display: flex; align-items: center; transform: rotate(180deg); }
  .side-hand-zone .hand .card + .card { margin-left: -8px; }

  .side-meld-zone {
    position: absolute; width: 100px; height: 340px;
    display: flex; align-items: flex-start; justify-content: center; padding-top: 6px;
    z-index: 10;
  }

  /* ═══════ 锁牌区（扎牌存放） ═══════ */
  .z-lock-area {
    position: absolute; bottom: 130px; left: 50%; transform: translateX(-50%);
    display: flex; flex-direction: row; align-items: center; justify-content: center;
    gap: 12px; min-height: 54px; min-width: 80px; z-index: 11;
  }
  .lock-group {
    display: flex; flex-direction: row; align-items: center; gap: 3px;
    padding: 4px 8px; background: rgba(0,0,0,0.25); border-radius: 6px;
    border: 1px solid rgba(212,168,87,0.4); position: relative;
  }
  .lock-group .lock-top {
    display: flex; gap: 3px;
  }
  .lock-group .lock-top .card {
    width: 32px; height: 44px; position: relative; cursor: default;
  }
  .lock-group .lock-top .card .card-char { font-size: 16px; }
  .lock-group .lock-wild-tag {
    position: absolute; top: -6px; right: -6px;
    background: #f59e0b; color: #fff; font-size: 9px;
    padding: 1px 4px; border-radius: 8px; font-weight: bold;
  }
  .lock-group .lock-label {
    font-size: 9px; color: #d4a857; text-align: center; white-space: nowrap;
    margin-left: 4px;
  }
  .lock-group .lock-btn {
    position: absolute; top: -8px; left: -8px;
    width: 18px; height: 18px; border-radius: 50%;
    background: rgba(239,68,68,0.9); color: #fff;
    font-size: 10px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; border: none; z-index: 2;
    opacity: 0; transition: opacity 0.15s;
  }
  .lock-group:hover .lock-btn { opacity: 1; }

  .z-meld-bottom {
    position: absolute; bottom: 180px; left: 50%; transform: translateX(-50%);
    width: 500px;
    display: flex; flex-direction: row; align-items: center; justify-content: center;
    gap: 12px; padding-top: 4px;
    z-index: 10;
  }
  .z-meld-bottom .melds-col {
    display: flex; flex-direction: row; gap: 8px; align-items: center;
  }
  .z-meld-bottom .meld-group {
    flex-direction: row; align-items: center; margin-top: 0;
  }
  .z-meld-bottom .meld-label {
    position: relative; top: auto; left: auto; transform: none;
    margin-left: 4px;
  }

  /* ═══════ 操作按钮 ═══════ */
  .action-panel {
    position: absolute; z-index: 30;
    display: none; gap: 4px;
    background: rgba(0,0,0,0.6); backdrop-filter: blur(6px);
    padding: 6px 10px; border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.12);
  }
  .action-panel.show { display: flex; }
  /* 扎牌选择弹窗 */
  .zha-pick-overlay {
    position: absolute; z-index: 50;
    top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: rgba(15,23,15,0.95); backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.15); border-radius: 12px;
    padding: 16px 20px; display: none; flex-direction: column;
    align-items: center; gap: 12px; min-width: 160px;
  }
  .zha-pick-overlay.show { display: flex; }
  .zha-pick-title {
    color: #f5f0e1; font-size: 14px; font-family: var(--font-cn);
    border-bottom: 1px solid rgba(255,255,255,0.1);
    padding-bottom: 8px; width: 100%; text-align: center;
  }
  .zha-pick-options { display: flex; gap: 12px; justify-content: center; }
  .zha-pick-btn {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    cursor: pointer; padding: 8px 14px; border-radius: 8px;
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
    transition: all 0.15s;
  }
  .zha-pick-btn:hover { background: rgba(255,255,255,0.14); border-color: rgba(234,179,8,0.5); }
  .zha-pick-ch {
    font-size: 28px; font-weight: bold; width: 44px; height: 58px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 4px; background: rgba(245,240,225,0.92);
    border: 1px solid rgba(0,0,0,0.12);
  }
  .zha-pick-ch.red { color: #c0392b; }
  .zha-pick-ch.black { color: #2c3e50; }
  .zha-pick-label { color: #f5f0e1; font-size: 12px; font-family: var(--font-cn); }
  .zha-pick-cancel {
    color: rgba(255,255,255,0.5); font-size: 12px; cursor: pointer;
    padding: 4px 16px; border-radius: 4px; font-family: var(--font-cn);
  }
  .zha-pick-cancel:hover { color: rgba(255,255,255,0.9); }
  .act-btn {
    background: rgba(0,0,0,0.65); backdrop-filter: blur(4px);
    color: #f5f0e1; border: 1px solid rgba(255,255,255,0.15);
    padding: 3px 14px; border-radius: 4px;
    font-size: 13px; font-family: var(--font-cn);
    cursor: pointer; transition: all 0.15s; white-space: nowrap;
  }
  .act-btn:hover { background: rgba(0,0,0,0.85); border-color: var(--gold-light); color: var(--gold-light); }
  .act-btn.highlight {
    background: rgba(217,119,6,0.85); border-color: var(--gold); color: #fff;
    animation: pulse 0.8s infinite;
  }
  @keyframes pulse {
    0%,100% { box-shadow: 0 0 0 0 rgba(217,119,6,0.4); }
    50% { box-shadow: 0 0 8px 2px rgba(217,119,6,0.6); }
  }
  .panel-bottom { bottom: 175px; left: 50%; transform: translateX(-50%); }

  .tip-bar {
    position: absolute; bottom: 174px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
    padding: 4px 14px; border-radius: 5px;
    font-size: 11px; color: rgba(245,240,225,0.5);
    z-index: 25; pointer-events: none; white-space: nowrap;
    transition: opacity 0.5s;
  }

  /* 流局遮罩 */
  .game-over-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7); backdrop-filter: blur(8px);
    display: none; align-items: center; justify-content: center;
    z-index: 500; flex-direction: column; gap: 16px;
  }
  .game-over-overlay.show { display: flex; }
  .game-over-title {
    font-size: 36px; font-weight: 700; color: var(--gold-light);
    font-family: var(--font-display);
    text-shadow: 0 2px 12px rgba(0,0,0,0.5);
  }
  .game-over-sub {
    font-size: 16px; color: rgba(245,240,225,0.7);
  }
  .game-over-btn {
    margin-top: 12px; padding: 8px 32px;
    background: rgba(217,119,6,0.85); border: 1px solid var(--gold); color: #fff;
    border-radius: 6px; font-size: 16px; font-family: var(--font-cn);
    cursor: pointer;
  }
  .game-over-btn:hover { background: rgba(217,119,6,1); }

  /* 胡牌高亮 */
  .card.win-highlight {
    box-shadow: 0 0 0 2px #f59e0b, 0 0 16px rgba(245,158,11,0.6) !important;
    z-index: 20 !important;
    transform: translateY(-4px);
    transition: all 0.3s ease;
  }
  .card.win-highlight.meld-kan {
    box-shadow: 0 0 0 2px #3b82f6, 0 0 12px rgba(59,130,246,0.5) !important;
  }
  .card.win-highlight.meld-pair {
    box-shadow: 0 0 0 2px #ef4444, 0 0 12px rgba(239,68,68,0.5) !important;
  }
  .card.win-highlight.meld-seq {
    box-shadow: 0 0 0 2px #10b981, 0 0 12px rgba(16,185,129,0.5) !important;
  }

  /* 胡牌提示按钮 */
  .act-btn.win-btn {
    background: linear-gradient(135deg, #f59e0b, #d97706);
    color: #fff;
    font-weight: bold;
    font-size: 15px;
    padding: 6px 16px;
    animation: winPulse 0.8s ease-in-out infinite;
  }
  @keyframes winPulse {

<script>
/* ═══════════════════════════════════════════════════
   Step4: 摸牌可视化 + 完整回合流转 + 流局检测
   ═══════════════════════════════════════════════════ */

const CARD_W = 40, CARD_H = 56, STEP_X = 40;
const handZone = document.getElementById('hand-zone');
const discardPool = document.getElementById('discard-pool');
const tipBar = document.getElementById('tip-bar');
const actionsDealer = document.getElementById('actions-dealer');
const deckZone = document.getElementById('deck-zone');

/* ═══ 牌堆 ═══ */
function generateDeck() {
  // 22种字面×5张(精牌3皮2花,非精5皮) + 2赖子 = 112张
  // 精牌(三五七乙九)每字5张: 3花+2皮, 非精牌全皮
  const allChars = [];
  const all22 = ['上','大','人','可','知','礼','三','五','七',
    '化','千','孔','己','二','四','六','八','十','子','土','乙','九'];
  all22.forEach(ch => {
    const isJ = JING_CHARS.has(ch);
    if (isJ) {
      // 精牌(三五七乙九): 3皮+2花=5张，每种精牌最多2个花
      for (let i = 0; i < 2; i++) allChars.push(ch + ':flower');
      for (let i = 0; i < 3; i++) allChars.push(ch + ':skin');
    } else {
      for (let i = 0; i < 5; i++) allChars.push(ch + ':skin');
    }
  });
  allChars.push('赖:skin', '赖:skin');
  // Fisher-Yates shuffle
  for (let i = allChars.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [allChars[i], allChars[j]] = [allChars[j], allChars[i]];
  }
  return allChars;
}

function charColor(ch) {
  return ['上','大','人','可','知','礼','三','五','七','赖'].includes(ch) ? 'red' : 'black';
}

function charVariant(ch) {
  if (ch === '赖') return 'laizi';
  if (ch === '三') return 'hua-mei';
  if (ch === '五') return 'hua-lan';
  if (ch === '七') return 'hua-zhu';
  if (ch === '乙') return 'hua-xia';
  if (ch === '九') return 'hua-dong';
  // 梅兰竹菊夏冬底纹也适用于同组的非精牌字
  if ('上大人'.includes(ch)) return 'hua-mei';
  if ('可'.includes(ch)) return 'hua-mei';     // 可知礼同属一组
  if ('知礼'.includes(ch)) return 'hua-mei';  // 可知礼同属一组
  return '';
}

// ═══ 胡牌检测常量（必须在 makeCardData 之前，避免 const TDZ）═══
const MIN_HU = 17;
// ── 花牌胡牌检测器（支持口眼） ──
// 顺子定义（与规则引擎一致）
// ═══════════════════════════════════════════════════
// 常量定义
// ═══════════════════════════════════════════════════
const FIXED_SEQS = [
  ['上','大','人'], ['可','知','礼'], ['化','三','千'],
  ['孔','乙','己'], ['七','十','土'], ['八','九','子'],
  // 数字顺子（连续数字三张一组，共8种）
  ['乙','二','三'], ['二','三','四'], ['三','四','五'], ['四','五','六'],
  ['五','六','七'], ['六','七','八'], ['七','八','九'], ['八','九','十']
];
const NUM_CHARS = ['乙','二','三','四','五','六','七','八','九','十'];
const ALL_SEQS = [...FIXED_SEQS]; // 14种（6固定+8数字），无需循环生成

const RED_SEQ_FROZEN = new Set([new Set(['上','大','人']), new Set(['可','知','礼'])]);

// 精牌集合
const JING_CHARS = new Set('三五七乙九');
const RED_JING = new Set('三五七');
const BLACK_JING = new Set('乙九');
const RED_CHARS = new Set('上大人可知礼三五七赖');
const WILD_CHAR = '赖';
const WILD_USABLE = new Set('三五七');

// 顺子查找表: char -> [包含该字的顺子]
const SEQ_BY_CHAR = {};
for (const seq of ALL_SEQS) {
  for (const ch of seq) {
    if (!SEQ_BY_CHAR[ch]) SEQ_BY_CHAR[ch] = [];
    SEQ_BY_CHAR[ch].push(seq);
  }
}

// 生成所有口（半顺子）: C(3,2) from each sequence
const ALL_KOU_LIST = [];
(function buildKouList() {
  const kouSet = new Set();
  for (const seq of ALL_SEQS) {
    for (let i = 0; i < 3; i++) {
      for (let j = i + 1; j < 3; j++) {
        const sorted = [seq[i], seq[j]].sort().join(',');
        if (!kouSet.has(sorted)) {
          kouSet.add(sorted);
          ALL_KOU_LIST.push([seq[i], seq[j]]);
        }
      }
    }
  }
})();

// 从牌堆取出的字符串'ch:v'解析为makeCardData参数
function parseDeckCard(deckStr) {
  const idx = deckStr.indexOf(':');
  if (idx >= 0) {
    return makeCardData(deckStr.substring(0, idx), deckStr.substring(idx + 1));
  }
  return makeCardData(deckStr);
}
function makeCardData(ch, v) {
  const isJ = JING_CHARS.has(ch);
  const isW = ch === WILD_CHAR;
  const variant = charVariant(ch);
  // v参数指定花/皮, 未指定时按规则: 精牌默认flower, 非精默认skin
  const val = (v !== undefined) ? v : (isJ ? 'flower' : 'skin');
  return { ch, c: charColor(ch), v: val, variant, isJin: isJ, isWild: isW };
}
/* ═══ 游戏状态机 ═══ */
const G = {
  round: 0,
  currentPlayer: 0,
  phase: 'play',
  deck: [],
  deckCount: 0,
  locked: false,
  drawnCard: null,   // 摸到的牌暂存数据
  drawnEl: null,     // 暂存牌的DOM元素
  lastPlayedChar: null,
  lastPlayedFrom: -1,
  gameOver: false,
};

const NAMES = ['庄家(你)', '下家', '上家'];
const SORT_ORDER = '上大人可知礼化三千孔乙己二四五六七八九子十土赖';

let handCards = [];
const opponentHands = { 1: [], 2: [] };
const opponentMelds = { 1: [], 2: [] };
const cardEls = [];

/* ═══ 初始化 ═══ */
function initGame() {
  G.deck = generateDeck();
  G.deckCount = G.deck.length;
  G.round = 0;
  G.currentPlayer = 0;
  G.phase = 'play';
  G.locked = false;
  G.drawnCard = null;
  G.drawnEl = null;
  G.lastPlayedChar = null;
  G.lastPlayedFrom = -1;
  G.gameOver = false;

  handCards = [];
  opponentHands[1] = [];
  opponentHands[2] = [];
  opponentMelds[1] = [];
  opponentMelds[2] = [];

  for (let i = 0; i < 26; i++) handCards.push(parseDeckCard(G.deck.pop()));
  for (let p = 1; p <= 2; p++)
    for (let i = 0; i < 25; i++) { const s = G.deck.pop(); opponentHands[p].push(s.indexOf(':') >= 0 ? s.substring(0,s.indexOf(':')) : s); }

  G.deckCount = G.deck.length;

  handZone.querySelectorAll('.card').forEach(el => el.remove());
  cardEls.length = 0;
  document.getElementById('melds-bottom').innerHTML = '';
  document.getElementById('lock-area').innerHTML = '';
  document.getElementById('melds-left').innerHTML = '';
  document.getElementById('melds-right').innerHTML = '';
  discardPool.innerHTML = '';
  document.getElementById('log-list').innerHTML = '';
  document.getElementById('hand-right').innerHTML = '';
  document.getElementById('hand-left').innerHTML = '';
  actionsDealer.classList.remove('show');
  document.getElementById('game-over').classList.remove('show');

  handCards.sort((a, b) => SORT_ORDER.indexOf(a.ch) - SORT_ORDER.indexOf(b.ch));
  layoutInitial();
  buildSideHand('hand-right', 25);
  buildSideHand('hand-left', 25);
  updateUI();
  updateOpponentCounts();
  if (checkDealerZhaAndHu()) return;
  setPhase('庄家出牌');
  unlockHand();
}

function restartGame() {
  initGame();
  // 更新局数显示
  var phaseEl = document.getElementById('phase-text');
  if (phaseEl) {
    var current = phaseEl.closest('.z-game-status');
    if (current) {
      var label = current.querySelector('.val');
      if (label) label.textContent = '第' + (_gameStats.totalGames + 1) + '局';
    }
  }
}

function findInsertIndex(cardData) {
const order = SORT_ORDER.indexOf(cardData.ch);
  for (let i = 0; i < handCards.length; i++) {
    if (SORT_ORDER.indexOf(handCards[i].ch) > order) return i;
  }
  return handCards.length;
}

function rearrangeHand() {
  const zW = handZone.offsetWidth, zH = handZone.offsetHeight;
  const perRow = Math.min(cardEls.length, Math.floor((zW - 10) / STEP_X));
  if (perRow <= 0) return;
  const rows = Math.ceil(cardEls.length / perRow);
  const startY = zH - rows * (CARD_H + 7) - 8;
  const startX = (zW - perRow * STEP_X + (STEP_X - CARD_W)) / 2;

  // ★ 扎牌已移至锁牌区，手牌区只有自由牌，直接排列
  cardEls.forEach((el, i) => {
    el.style.left = (startX + (i % perRow) * STEP_X) + 'px';
    el.style.top = (startY + Math.floor(i / perRow) * (CARD_H + 6)) + 'px';
  });
}

function layoutInitial() {
  const zW = handZone.offsetWidth, zH = handZone.offsetHeight;
  const perRow = Math.min(handCards.length, Math.floor((zW - 10) / STEP_X));
  const rows = Math.ceil(handCards.length / perRow);
  const startY = zH - rows * (CARD_H + 7) - 8;
  const startX = (zW - perRow * STEP_X + (STEP_X - CARD_W)) / 2;
  handCards.forEach((d, i) => {
    var el = createCardEl(d, startX + (i % perRow) * STEP_X, startY + Math.floor(i / perRow) * (CARD_H + 6));
    // 扎牌已移至锁牌区，layoutInitial只需排列手牌区的自由牌
  });
  // 初始布局后应用扎牌叠放排列
  rearrangeHand();
}

/* ═══ 创建牌面 ═══ */
function createCardEl(data, x, y) {
  const el = document.createElement('div');
  const variant = data.variant || '';
  const vf = data.v === 'flower' ? ' v-flower' : '';
  el.className = 'card in-hand' + (variant ? ' ' + variant : '') + vf + (G.locked ? ' locked' : '');
  el.innerHTML = '<span class="card-char ' + data.c + '">' + data.ch + '</span>';
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  el.dataset.ch = data.ch;
  el.dataset.color = data.c;
  el.dataset.v = data.v || '';
  el.dataset.variant = data.variant || '';
  el.addEventListener('mousedown', onDown);
  el.addEventListener('touchstart', onTouchDown, { passive: false });
  el.addEventListener('dblclick', onDblClick);
  cardEls.push(el);
  handZone.appendChild(el);
  return el;
}

/* ═══ 锁定/解锁 ═══ */
function lockHand() {
  G.locked = true;
  handZone.classList.add('locked');
  cardEls.forEach(el => el.classList.add('locked'));
  if (G.drawnEl) G.drawnEl.classList.add('locked');
}
// 旁家操作时: 仅锁定出牌/双击出牌等游戏操作，但允许手牌拖拽整理
function lockHandForOpponent() {
  G.locked = true;  // 阻止双击出牌、碰牌等游戏操作
  handZone.classList.add('btns-locked');
  // 不给手牌添加locked类，保持可拖拽
}

function unlockHand() {
  G.locked = false;
  handZone.classList.remove('locked');
  handZone.classList.remove('btns-locked');
  cardEls.forEach(el => el.classList.remove('locked'));
  if (G.drawnEl) G.drawnEl.classList.remove('locked');
}

/* ═══ 拖动 ═══ */
let drag = null, dragMoved = false, dragStartPos = null;
function onDown(e) {
  e.preventDefault(); dragStartPos = {x:e.clientX,y:e.clientY}; beginDrag(e.currentTarget, e.clientX, e.clientY);
}
function onTouchDown(e) {
  e.preventDefault(); const t=e.touches[0]; dragStartPos = {x:t.clientX,y:t.clientY}; beginDrag(e.currentTarget, t.clientX, t.clientY);
}
function beginDrag(el, cx, cy) {
  const r = handZone.getBoundingClientRect();
  drag = { el, ox: cx-r.left-parseFloat(el.style.left), oy: cy-r.top-parseFloat(el.style.top) };
  dragMoved = false;
  el.classList.add('dragging');
}
function onMove(cx, cy) {
  if (!drag) return;
  const r = handZone.getBoundingClientRect();
  let x = cx-r.left-drag.ox, y = cy-r.top-drag.oy;
  const m = CARD_W*0.6;
  x = Math.max(-m, Math.min(handZone.offsetWidth-CARD_W+m, x));
  y = Math.max(-m, Math.min(handZone.offsetHeight-CARD_H+m, y));
  drag.el.style.left = x+'px'; drag.el.style.top = y+'px';
  if (Math.abs(cx-dragStartPos.x)+Math.abs(cy-dragStartPos.y)>5) dragMoved = true;
  if (dragMoved) highlightNearby(drag.el);
}
document.addEventListener('mousemove', e => onMove(e.clientX, e.clientY));
document.addEventListener('touchmove', e => { if(drag){e.preventDefault();onMove(e.touches[0].clientX,e.touches[0].clientY);} }, {passive:false});
function endDrag() {
  if (!drag) return;
  drag.el.classList.remove('dragging');
  if (dragMoved) snapToGroup(drag.el);
  clearHighlights(); drag = null;
}
document.addEventListener('mouseup', endDrag);
document.addEventListener('touchend', endDrag);
function highlightNearby(dragEl) {
  const dx=parseFloat(dragEl.style.left), dy=parseFloat(dragEl.style.top), ch=dragEl.dataset.ch;
  cardEls.forEach(el => {
    if(el===dragEl){el.classList.remove('grouped');return;}
    const dist=Math.hypot(dx-parseFloat(el.style.left),dy-parseFloat(el.style.top));
    el.classList.toggle('grouped',dist<CARD_W*1.8&&el.dataset.ch===ch);
  });
}
function clearHighlights() { cardEls.forEach(el => el.classList.remove('grouped')); }
function snapToGroup(dragEl) {
  const dx=parseFloat(dragEl.style.left),dy=parseFloat(dragEl.style.top),ch=dragEl.dataset.ch;
  let best=null,bestDist=Infinity;
  cardEls.forEach(el => {
    if(el===dragEl||el.dataset.ch!==ch)return;
    const dist=Math.hypot(dx-parseFloat(el.style.left),dy-parseFloat(el.style.top));
    if(dist<bestDist){bestDist=dist;best=el;}
  });
  if(best&&bestDist<CARD_W*2.5){
    const tx=parseFloat(best.style.left),ty=parseFloat(best.style.top);
    dragEl.style.left=(dx>tx?tx+STEP_X:Math.max(0,tx-STEP_X))+'px';
    dragEl.style.top=(dx>tx?ty+2:Math.max(0,ty-2))+'px';
    dragEl.style.zIndex='2';
  }
}

/* ═══ 双击出牌 ═══ */
function onDblClick(e) {
  if (dragMoved || G.locked || G.gameOver) return;
  playCard(e.currentTarget);
}

function playCard(el) {
  lockHand();

  const srcRect = el.getBoundingClientRect();
  const char = el.dataset.ch, color = el.dataset.color, variant = el.dataset.variant;

  // 判断是否打出暂存牌
  const isDrawn = (el === G.drawnEl);
  if (isDrawn) { G.drawnCard = null; G.drawnEl = null; }

  // 从cardEls和handCards中移除（暂存牌不在其中，跳过）
  const cardIdx = cardEls.indexOf(el);
  if (cardIdx !== -1) {
    cardEls.splice(cardIdx, 1);
    if (el.parentNode === handZone) handZone.removeChild(el);
  } else if (!isDrawn) {
    // 不在cardEls中也不是暂存牌，异常情况
    return;
  }
  // 暂存牌：从DOM移除即可，不在cardEls/handCards中

  if (!isDrawn) {
    const hcIdx = handCards.findIndex(c => c.ch === char);
    if (hcIdx !== -1) handCards.splice(hcIdx, 1);
  }

  G.round++;
  updateUI();

  // 飞行动画
  const flyEl = document.createElement('div');
  const v = variant || '';
  const fv = el.dataset.v === 'flower' ? ' v-flower' : '';
  flyEl.className = 'card flying' + (v ? ' ' + v : '') + fv;
  flyEl.innerHTML = '<span class="card-char ' + color + '">' + char + '</span>';
  flyEl.style.left = srcRect.left+'px'; flyEl.style.top = srcRect.top+'px';
  flyEl.style.width = srcRect.width+'px'; flyEl.style.height = srcRect.height+'px';
  document.body.appendChild(flyEl);

  const tgtRect = discardPool.getBoundingClientRect();
  requestAnimationFrame(() => requestAnimationFrame(() => {
    flyEl.style.left = (tgtRect.left+tgtRect.width/2-15)+'px';
    flyEl.style.top = (tgtRect.top+tgtRect.height/2-21)+'px';
    flyEl.style.width = '30px'; flyEl.style.height = '42px'; flyEl.style.opacity = '0.85';
  }));
  flyEl.addEventListener('transitionend', () => {
    flyEl.remove();
    addDiscardCard(char, color, variant, el.dataset.v === 'flower');
    G.lastPlayedChar = char;
    G.lastPlayedFrom = 0;
    console.log('[流程] 庄家出牌完成, char=' + char);

    // 暂存牌已经在此函数开头被清除(isDrawn=true时)，无需合入
    // 但如果是打出手牌(isDrawn=false)，暂存牌应该还在，需要合入
    if (!isDrawn && G.drawnCard && G.drawnEl && G.drawnEl.parentNode) {
      const dData = G.drawnCard;
      const dEl = G.drawnEl;
      console.log('[流程] 暂存牌合入手牌, char=' + dData.ch);
      G.drawnCard = null;
      G.drawnEl = null;
      // 按字面顺序插入
      const insIdx = findInsertIndex(dData);
      handCards.splice(insIdx, 0, dData);
      // 更新样式：清除暂存时的inline定位样式，恢复为普通手牌
      dEl.style.position = '';
      dEl.style.zIndex = '';
      dEl.style.transition = '';
      dEl.style.cursor = 'grab';
      dEl.classList.remove('just-drawn');
      dEl.classList.add('in-hand');
      dEl.classList.remove('locked');
      // 插入到cardEls正确位置
      cardEls.splice(insIdx, 0, dEl);
      // 调整DOM顺序：insertBefore在同一父节点内移动会自动移除旧位置，无需removeChild
      const handChildren = [...handZone.children].filter(c => cardEls.includes(c));
      const refChild = insIdx < handChildren.length ? handChildren[insIdx] : null;
      if (refChild) {
        handZone.insertBefore(dEl, refChild);
      } else {
        const lastHand = handChildren.length > 0 ? handChildren[handChildren.length - 1] : null;
        if (lastHand) {
          handZone.insertBefore(dEl, lastHand.nextSibling);
        } else {
          handZone.appendChild(dEl);
        }
      }
      // 重新排列
      rearrangeHand();
    }

    // 出牌后检测听牌
    try {
      const ting = detectTing();
      if (ting && ting.tingChars && ting.tingChars.length > 0) {
        showTingPanel(ting);
      } else {
        hideTingPanel();
      }
    } catch(e) { console.warn('[听牌] 出牌后听牌检测异常:', e); }

    checkOpponentResponse();
  }, {once:true});

  // 暂存牌出牌后从DOM移除
  if (isDrawn && el.parentNode) {
    el.remove();
  }

  addLog(NAMES[0], '出', char);
  setPhase('等待响应');
}

function addDiscardCard(char, color, variant, isFlower) {
  if (char && char.indexOf(':') >= 0) char = char.substring(0, char.indexOf(':'));
  const prev = discardPool.querySelector('.just-played');
  if (prev) prev.classList.remove('just-played');
  const el = document.createElement('div');
  const v = variant || '';
  const fv = isFlower ? ' v-flower' : '';
  el.className = 'card just-played' + (v ? ' ' + v : '') + fv;
  el.innerHTML = '<span class="card-char ' + color + '">' + char + '</span>';
  el.style.position = 'relative';
  el.dataset.ch = char;
  el.dataset.v = isFlower ? 'flower' : 'skin';
  el.dataset.variant = v;
  discardPool.appendChild(el);
}

/* ═══ 旁家响应检测（庄家出牌后） ═══ */
function checkOpponentResponse() {
  console.log("[流程] checkOpponentResponse, char=" + G.lastPlayedChar + ", from=" + G.lastPlayedFrom);
  // 旁家操作期间，允许玩家拖拽手牌整理（但不能出牌）
  lockHandForOpponent();
  const ch = G.lastPlayedChar;
  const from = G.lastPlayedFrom;

  for (const pi of [1, 2]) {
    const count = opponentHands[pi].filter(c => c === ch).length;
    // 检查旁家是否有扎牌可升级为泛牌（扎牌+旁家出同字→泛牌）
    var hasZha = false;
    for (var mi = 0; mi < opponentMelds[pi].length; mi++) {
      if (opponentMelds[pi][mi].type === 'zha' && opponentMelds[pi][mi].cards[0] === ch) {
        hasZha = true; break;
      }
    }
    if (count >= 2) {
      if (hasZha) {
        // 扎牌+旁家出同字→泛牌（取旁家手中2张+弃牌1张+扎牌区第4张=第5张）
        addLog(NAMES[pi], '泛', ch);
        opponentFan(pi, ch);
        return;
      }
      addLog(NAMES[pi], '碰', ch);
      setPhase(NAMES[pi] + '碰牌中');
      setTimeout(() => opponentPen(pi, ch), 800);
      return;
    }
  }

  addLog('', '无人响应', '');
  console.log('[流程] 无人响应, 将passToNext(' + from + ')');
  setTimeout(() => passToNext(from), 600);
}

/* ═══ 旁家出牌后响应检测 ═══ */
function checkResponseAfterOpponent(fromIdx) {
  console.log("[流程] checkResponseAfterOpponent, from=" + fromIdx + ", char=" + G.lastPlayedChar);
  const ch = G.lastPlayedChar;

  // 1. 检查庄家是否可碰或可招
  const dealerCount = handCards.filter(c => c.ch === ch).length;
  // 也检查暂存牌
  const drawnMatch = G.drawnCard && G.drawnCard.ch === ch ? 1 : 0;
  const totalCount = dealerCount + drawnMatch;
  var canZhao = totalCount >= 3;
  var canPen = totalCount >= 2;

  // ★ 限两对：胡牌前最多两次碰牌机会
  var penCount = G.dealerMelds ? G.dealerMelds.filter(m => m.type === 'pen').length : 0;
  if (canPen && penCount >= 2) canPen = false;

  // ★ 检查过牌记录
  if (canPen && G._skippedOps['pen_' + ch]) canPen = false;
  if (canZhao && G._skippedOps['zhao_' + ch]) canZhao = false;

  if (canZhao || canPen) {
    setPhase(canZhao ? '等待你碰/招牌' : '等待你碰牌');
    actionsDealer.classList.add('show');
    document.getElementById('btn-zhao').style.display = canZhao ? '' : 'none';
    document.getElementById('btn-pen').style.display = canPen ? '' : 'none';
    document.getElementById('btn-pass').style.display = '';
    document.getElementById('btn-hu').style.display = 'none';
    document.getElementById('btn-zha').style.display = 'none';
    document.getElementById('btn-fan').style.display = 'none';
    document.getElementById('btn-chuan').style.display = 'none';
    return;
  }

  // 2. 检查另一个旁家
  const otherPlayers = [1, 2].filter(p => p !== fromIdx);
  for (const pi of otherPlayers) {
    const count = opponentHands[pi].filter(c => c === ch).length;
    var hasZha = false;
    for (var mi = 0; mi < opponentMelds[pi].length; mi++) {
      if (opponentMelds[pi][mi].type === 'zha' && opponentMelds[pi][mi].cards[0] === ch) {
        hasZha = true; break;
      }
    }
    if (count >= 2) {
      if (hasZha) {
        addLog(NAMES[pi], '泛', ch);
        opponentFan(pi, ch);
        return;
      }
      addLog(NAMES[pi], '碰', ch);
      setPhase(NAMES[pi] + '碰牌中');
      setTimeout(() => opponentPen(pi, ch), 800);
      return;
    }
  }

  // 3. 都不碰 → 流转
  setTimeout(() => passToNext(fromIdx), 400);
}

/* ═══ 旁家碰牌 ═══ */
function opponentPen(playerIdx, char) {
  console.log("[流程] opponentPen, player=" + playerIdx + ", char=" + char);
  const hand = opponentHands[playerIdx];
  let removed = 0;
  for (let i = hand.length - 1; i >= 0 && removed < 2; i--) {
    if (hand[i] === char) { hand.splice(i, 1); removed++; }
  }
  const lastDiscard = discardPool.lastElementChild;
  if (lastDiscard) lastDiscard.remove();

  opponentMelds[playerIdx].push({ type: 'pen', cards: [char, char, char] });
  updateOpponentCounts();

  // 碰牌不摸牌
  addLog(NAMES[playerIdx], '碰牌完成', '');

  // 碰牌者获得出牌权，自动出一张
  setTimeout(() => {
    if (hand.length > 0) {
      const playIdx = aiPickDiscard(hand);
      const played = hand.splice(playIdx, 1)[0];
      addLog(NAMES[playerIdx], '出', played);
      setPhase(NAMES[playerIdx] + '出牌中');
      G.lastPlayedChar = played;
      G.lastPlayedFrom = playerIdx;
      addDiscardCard(played, charColor(played), charVariant(played));
      updateOpponentCounts();

      setTimeout(() => checkResponseAfterOpponent(playerIdx), 500);
    }
  }, 800);
}



/* ═══ 旁家招牌（明杠） ═══ */
function opponentZhao(playerIdx, char) {
  console.log("[流程] opponentZhao, player=" + playerIdx + ", char=" + char);
  const hand = opponentHands[playerIdx];

  // 取出手中全部3张该字
  let removed = 0;
  for (let i = hand.length - 1; i >= 0 && removed < 3; i--) {
    if (hand[i] === char) { hand.splice(i, 1); removed++; }
  }

  const lastDiscard = discardPool.lastElementChild;
  if (lastDiscard) lastDiscard.remove();

  opponentMelds[playerIdx].push({ type: 'zhao', cards: [char, char, char, char] });
  addOpponentMeld(playerIdx, 'zhao', char);
  updateOpponentCounts();

  addLog(NAMES[playerIdx], '招', char);

  // 招牌后摸牌顶
  if (G.deckCount > 0) {
    var _ds0 = G.deck.pop(); hand.push(_ds0.indexOf(':') >= 0 ? _ds0.substring(0, _ds0.indexOf(':')) : _ds0);
    G.deckCount--;
    addLog(NAMES[playerIdx], '招后摸牌', '');

/* ═══ 庄家扎牌+自摸检测（通用） ═══ */
// 在摸牌后和初始化时调用，检测庄家是否可以扎牌或自摸
function checkDealerZhaAndHu() {
  var huResult = checkDealerSelfHu();
  var allChars = handCards.map(c => c.ch);
  if (G.drawnCard) allChars.push(G.drawnCard.ch);
  var counts = {};
  for (var c of allChars) counts[c] = (counts[c] || 0) + 1;
  // 统计赖子数量（仅手牌中的赖子，不含已扎锁定的）
  var wildCount = counts[WILD_CHAR] || 0;
  // 收集已扎过的字，不重复检测
  var alreadyZha = {};
  if (G.dealerMelds) {
    for (var m of G.dealerMelds) {
      if (m.type === 'zha' && m.inHand) alreadyZha[m.char] = true;
    }
  }
  // ★ 收集所有可扎字符（物理4张 + 赖子精扎3三五七+1赖子 + 赖子精扎2三五七+2赖子）
  var zhaChars = [];
  for (var c in counts) {
    if (alreadyZha[c]) continue;
    if (counts[c] >= 4) {
      zhaChars.push(c);
    } else if (WILD_USABLE.has(c) && wildCount > 0) {
      var need = 4 - counts[c]; // 需要的赖子数量
      if (need >= 1 && need <= wildCount) {
        zhaChars.push(c);
      }
    }
  }
  G._zhaChars = zhaChars;
  G._zhaChar = zhaChars.length > 0 ? zhaChars[0] : null;

  // ★ 检测泛牌：摸到的牌与已有招牌同字 → 泛牌
  var fanChar = null;
  if (G.drawnCard && G.dealerMelds) {
    for (var mi = 0; mi < G.dealerMelds.length; mi++) {
      var fm = G.dealerMelds[mi];
      if (fm.type === 'zhao' && fm.char === G.drawnCard.ch) {
        fanChar = G.drawnCard.ch;
        break;
      }
    }
  }

  // ★ 检测穿牌：摸到的牌与已有inHand扎牌同字 → 穿牌
  var chuanChar = null;
  var chuanIsWildZha = false;
  if (G.drawnCard && G.dealerMelds) {
    for (var mi = 0; mi < G.dealerMelds.length; mi++) {
      var cm = G.dealerMelds[mi];
      if (cm.type === 'zha' && cm.inHand && cm.char === G.drawnCard.ch) {
        chuanChar = G.drawnCard.ch;
        chuanIsWildZha = !!cm.isWildZha;
        break;
      }
    }
  }

  // ★ 检测泛牌（扎牌+旁家出同字）也在 _pendingFan 中处理，这里不再重复

  if (huResult || zhaChars.length > 0 || fanChar || chuanChar) {
    if (huResult) {
      console.log('[流程] 庄家可自摸! ' + huResult.totalHu + '胡');
      G._pendingWin = { ...huResult, winType: '自摸' };
    }
    if (zhaChars.length > 0) {
      console.log('[流程] 庄家可扎牌: ' + zhaChars.join(', '));
    }
    if (fanChar) {
      console.log('[流程] 庄家可泛牌: ' + fanChar);
    }
    var phaseText = '';
    if (huResult) phaseText += '胡牌';
    if (fanChar) phaseText += (phaseText ? '/' : '') + '泛牌';
    if (chuanChar) phaseText += (phaseText ? '/' : '') + '穿牌';
    if (zhaChars.length > 0) phaseText += (phaseText ? '/' : '') + '扎牌';
    setPhase('庄家可' + phaseText);
    actionsDealer.classList.add('show');
    document.getElementById('btn-hu').style.display = huResult ? '' : 'none';
    document.getElementById('btn-zhao').style.display = 'none';
    document.getElementById('btn-pen').style.display = 'none';
    document.getElementById('btn-zha').style.display = zhaChars.length > 0 ? '' : 'none';
    document.getElementById('btn-fan').style.display = fanChar ? '' : 'none';
    document.getElementById('btn-chuan').style.display = chuanChar ? '' : 'none';
    document.getElementById('btn-pass').style.display = '';
    unlockHand();
    updateUI();
    return true;
  }
  // 隐藏所有操作按钮
  document.getElementById('btn-fan').style.display = 'none';
  document.getElementById('btn-chuan').style.display = 'none';
  document.getElementById('btn-pass').style.display = 'none';
  actionsDealer.classList.remove('show');
  return false;
}

/* ═══════ 锁牌区渲染 ═══════ */
function renderLockArea() {
  var container = document.getElementById('lock-area');
  container.innerHTML = '';
  if (!G.dealerMelds) { container.style.display = 'none'; return; }
  var hasZha = false;
  for (var mi = 0; mi < G.dealerMelds.length; mi++) {
    var m = G.dealerMelds[mi];
    if (m.type !== 'zha' || !m.inHand) continue;
    hasZha = true;
    var g = document.createElement('div');
    g.className = 'lock-group';

    // 解扎按钮
    var btn = document.createElement('button');
    btn.className = 'lock-btn';
    btn.textContent = '\u00d7';
    btn.title = '解扎（换扎）';
    btn.dataset.zhaIdx = mi;
    btn.onclick = (function(idx) {
      return function(e) {
        e.stopPropagation();
        unlockZha(idx);
      };
    })(mi);
    g.appendChild(btn);

    var topRow = document.createElement('div');
    topRow.className = 'lock-top';
    for (var ci = 0; ci < m.cards.length; ci++) {
      var card = m.cards[ci];
      var color = charColor(card.ch);
      var variant = card.variant || charVariant(card.ch);
      var cvf = card.v === 'flower' ? ' v-flower' : '';
      var c = document.createElement('div');
      c.className = 'card' + (variant ? ' ' + variant : '') + cvf;
      c.innerHTML = '<span class="card-char" style="color:' + (color === 'red' ? 'var(--red)' : 'var(--black)') + '">' + card.ch + '</span>';
      topRow.appendChild(c);
    }
    g.appendChild(topRow);

    // 赖子扎牌标记
    if (m.isWildZha) {
      var tag = document.createElement('div');
      tag.className = 'lock-wild-tag';
      tag.textContent = '赖';
      g.appendChild(tag);
    }

    var lbl = document.createElement('div');
    lbl.className = 'lock-label';
    lbl.textContent = '扎' + m.char;
    g.appendChild(lbl);
    container.appendChild(g);
  }
  container.style.display = hasZha ? 'flex' : 'none';
}

/* ═══════ 换扎（解扎+释放锁定的牌回手牌） ═══════ */
function unlockZha(zhaIdx) {
  if (!G.dealerMelds || !G.dealerMelds[zhaIdx]) return;
  var m = G.dealerMelds[zhaIdx];
  if (m.type !== 'zha' || !m.inHand) return;
  console.log('[流程] 换扎: 解除扎' + m.char);
  addLog(NAMES[0], '解扎', m.char);
  // 将锁牌区的牌释放回手牌
  for (var ci = 0; ci < m.cards.length; ci++) {
    var card = m.cards[ci];
    if (card._zhaUsed) card._zhaUsed = false;
    // 找到插入位置
    var insIdx = 0;
    for (var si = 0; si < handCards.length; si++) {
if (SORT_ORDER.indexOf(card.ch) >= SORT_ORDER.indexOf(handCards[si].ch)) { insIdx = si; break; }
      insIdx = si + 1;
    }
    handCards.splice(insIdx, 0, card);
    // 创建DOM元素
    var color = charColor(card.ch);
    var variant = card.variant || charVariant(card.ch);
    var el = createCardEl(card, 0, 0);
    el.classList.add('in-hand');
    el.classList.remove('just-drawn');
    el.style.cursor = 'grab';
    cardEls.splice(insIdx, 0, el);
    handZone.appendChild(el);
  }
  // 移除该扎牌记录
  G.dealerMelds.splice(zhaIdx, 1);
  renderLockArea();
  rearrangeHand();
  // 解扎后检测是否还有新的扎牌机会
  checkDealerZhaAndHu();
  if (!G._zhaChars || G._zhaChars.length === 0) {
    if (!G._pendingWin) {
      setPhase('庄家出牌');
      G.phase = 'play';
    }
  }
  unlockHand();
  updateUI();
}

/* ═══ 庄家扎牌（暗杠） ═══ */
function dealerZha(ch) {
  console.log("[流程] dealerZha, ch=" + ch);

  // 如果没有指定字符，且有多个可扎选择，显示选择框
  if (!ch && G._zhaChars && G._zhaChars.length > 1) {
    showZhaPickDialog(G._zhaChars);
    return;
  }
  // 单个可扎字符时自动使用
  if (!ch && G._zhaChars && G._zhaChars.length === 1) ch = G._zhaChars[0];

  actionsDealer.classList.remove('show');
  document.getElementById('btn-hu').style.display = 'none';

  // 合并暂存牌到手牌
  if (G.drawnCard) {
    handCards.push(G.drawnCard);
    if (G.drawnEl) {
      G.drawnEl.classList.remove('just-drawn');
      G.drawnEl.classList.add('in-hand');
      G.drawnEl.style.cursor = 'grab';
      G.drawnEl.style.zIndex = '';
      cardEls.push(G.drawnEl);
    }
    G.drawnCard = null; G.drawnEl = null;
  }

  // 统计手牌中各字符数量
  var allChars = handCards.map(function(c) { return c.ch; });
  var counts = {};
  for (var c of allChars) counts[c] = (counts[c] || 0) + 1;
  var wildFree = counts[WILD_CHAR] || 0;

  // 判断扎牌类型
  var wildNeed = 4 - counts[ch]; // 需要的赖子数量
  var isWildZha = (WILD_USABLE.has(ch) && wildNeed >= 1 && wildNeed <= wildFree);
  if (!isWildZha) {
    if (!ch || !counts[ch] || counts[ch] < 4) {
      console.log('[错误] dealerZha: 字符' + ch + '不足4张');
      unlockHand(); return;
    }
  }

  // ★ 从手牌区和cardEls/DOM中移除扎牌的4张牌
  var zhaCards = [];
  var removed = 0;
  var needCh = isWildZha ? counts[ch] : 4; // 赖子精扎时移除所有该字（2或3张）
  for (var i = handCards.length - 1; i >= 0 && removed < needCh; i--) {
    if (handCards[i].ch === ch) {
      zhaCards.unshift(handCards.splice(i, 1)[0]);
      if (i < cardEls.length) {
        var el = cardEls.splice(i, 1)[0];
        if (el.parentNode) el.remove();
      }
      removed++;
    }
  }
  // 移除所需数量的赖子
  if (isWildZha) {
    var wildRemoved = 0;
    for (var i = handCards.length - 1; i >= 0 && wildRemoved < wildNeed; i--) {
      if (handCards[i].ch === WILD_CHAR && !handCards[i]._zhaUsed) {
        handCards[i]._zhaUsed = true;
        zhaCards.push(handCards.splice(i, 1)[0]);
        if (i < cardEls.length) {
          var el = cardEls.splice(i, 1)[0];
          if (el.parentNode) el.remove();
        }
        wildRemoved++;
      }
    }
  }

  if (!G.dealerMelds) G.dealerMelds = [];
  G.dealerMelds.push({ type: 'zha', char: ch, count: 4, cards: zhaCards, inHand: true, isWildZha: !!isWildZha });
  addLog(NAMES[0], '扎', ch + (isWildZha ? '(赖)' : ''));
  // ★ 渲染锁牌区 + 重排手牌
  renderLockArea();
  rearrangeHand();

  // 扎牌后检测穿牌（摸牌底，如果摸到同字第5张→穿牌升级）
  dealerCheckChuan(ch, isWildZha);
}

/* ═══ 穿牌/泛牌检测（扎/招后拿到同字第5张） ═══ */
// 扎牌自摸同字→穿牌（摸牌底），招牌自摸同字或旁家出同字→泛牌（摸牌顶）
// 此函数由dealerZha调用（扎牌后检查升级），dealerZhao中的泛牌检测内联处理
function dealerCheckChuan(ch, isWildZha) {
  // 穿牌流程: 扎牌后先摸牌底，再检查摸到的牌是否同字→穿牌升级
  // isWildZha: 是否为赖子扎牌（3张同字+1赖子），穿牌时检测第4张物理牌
  if (G.deckCount > 0) {
    var drawnCh = G.deck.shift();
    G.deckCount--;
    var data = parseDeckCard(drawnCh);
    var pureCh = drawnCh.indexOf(':') >= 0 ? drawnCh.substring(0, drawnCh.indexOf(':')) : drawnCh;
    addLog(NAMES[0], '摸牌', pureCh);
    setPhase('庄家摸牌中');

    animateDealerDraw(data, function() {
      // 摸牌完成后检查是否为穿牌字
      if (G.drawnCard && G.drawnCard.ch === ch) {
        // 摸到同字 → 穿牌升级！
        console.log('[流程] 穿牌! ch=' + ch + (isWildZha ? ' (赖子扎→穿)' : ''));
        // 从暂存牌取穿牌字
        if (G.drawnEl && G.drawnEl.parentNode === handZone) G.drawnEl.remove();
        G.drawnCard = null; G.drawnEl = null;

        // 穿牌升级：从锁牌区移除扎牌记录，替换为穿牌记录
        var zhaRecord = null;
        for (var mi = G.dealerMelds.length - 1; mi >= 0; mi--) {
          if (G.dealerMelds[mi].type === 'zha' && G.dealerMelds[mi].char === ch) {
            zhaRecord = G.dealerMelds.splice(mi, 1)[0];
            break;
          }
        }
        // 将扎牌记录升级为穿牌（保留cards数据，改为type:'chuan'，清除inHand标记）
        if (zhaRecord) {
          zhaRecord.type = 'chuan';
          zhaRecord.count = 5;
          delete zhaRecord.inHand;
          G.dealerMelds.push(zhaRecord);
        }
        addDealerMeld('chuan', ch, ch, zhaRecord ? zhaRecord.cards : null);
        addLog(NAMES[0], '穿', ch + (isWildZha ? '(赖)' : ''));
        renderLockArea();
        rearrangeHand();

        // 穿牌后再摸牌底补牌
        if (G.deckCount > 0) {
          var drawnCh2 = G.deck.shift();
          G.deckCount--;
          var data2 = parseDeckCard(drawnCh2);
          var pureCh2 = drawnCh2.indexOf(':') >= 0 ? drawnCh2.substring(0, drawnCh2.indexOf(':')) : drawnCh2;
          addLog(NAMES[0], '摸牌', pureCh2);
          setPhase('庄家摸牌中');
          animateDealerDraw(data2, function() {
            checkDealerZhaAndHu();
            if (!G._zhaChars || G._zhaChars.length === 0) {
              if (!G._pendingWin) {
                setPhase('庄家出牌');
                G.phase = 'play';
              }
            }
            unlockHand();
            updateUI();
          });
        } else {
          setPhase('庄家出牌');
          unlockHand();
          updateUI();
        }
      } else {
        // 摸到的不是穿牌字，正常继续
        checkDealerZhaAndHu();
        if (!G._zhaChars || G._zhaChars.length === 0) {
          if (!G._pendingWin) {
            setPhase('庄家出牌');
            G.phase = 'play';
          }
        }
        unlockHand();
        updateUI();
      }
    });
  } else {
    setPhase('庄家出牌');
    unlockHand();
    updateUI();
  }
}


// ═══ 庄家穿牌（正常摸牌流程中触发） ═══
function dealerChuan() {
  console.log('[流程] dealerChuan');
  actionsDealer.classList.remove('show');

  // 找到匹配的inHand扎牌
  var chuanChar = null;
  var chuanIsWildZha = false;
  if (G.drawnCard && G.dealerMelds) {
    for (var mi = 0; mi < G.dealerMelds.length; mi++) {
      var cm = G.dealerMelds[mi];
      if (cm.type === 'zha' && cm.inHand && cm.char === G.drawnCard.ch) {
        chuanChar = G.drawnCard.ch;
        chuanIsWildZha = !!cm.isWildZha;
        break;
      }
    }
  }
  if (!chuanChar) { console.log('[错误] dealerChuan: 无匹配扎牌'); return; }

  // 取暂存牌
  if (G.drawnEl && G.drawnEl.parentNode === handZone) G.drawnEl.remove();
  G.drawnCard = null; G.drawnEl = null;

  // 穿牌升级
  var zhaRecord = null;
  for (var mi = G.dealerMelds.length - 1; mi >= 0; mi--) {
    if (G.dealerMelds[mi].type === 'zha' && G.dealerMelds[mi].char === chuanChar) {
      zhaRecord = G.dealerMelds.splice(mi, 1)[0];
      break;
    }
  }
  if (zhaRecord) {
    zhaRecord.type = 'chuan';
    zhaRecord.count = 5;
    delete zhaRecord.inHand;
    // 添加穿牌的第5张牌到cards中
    var chuanCard = makeCardData(chuanChar);
    zhaRecord.cards.push(chuanCard);
    zhaRecord.chars.push(chuanChar);
    G.dealerMelds.push(zhaRecord);
  }
  addDealerMeld('chuan', chuanChar, chuanChar, zhaRecord ? zhaRecord.cards : null);
  addLog(NAMES[0], '穿', chuanChar + (chuanIsWildZha ? '(赖)' : ''));
  renderLockArea();
  rearrangeHand();

  // 穿牌后补摸一张牌
  if (G.deckCount > 0) {
    var drawnCh = G.deck.shift();
    G.deckCount--;
    var data = parseDeckCard(drawnCh);
    var pureCh = drawnCh.indexOf(':') >= 0 ? drawnCh.substring(0, drawnCh.indexOf(':')) : drawnCh;
    addLog(NAMES[0], '摸牌', pureCh);
    setPhase('庄家摸牌中');
    animateDealerDraw(data, function() {
      checkDealerZhaAndHu();
      if (!G._zhaChars || G._zhaChars.length === 0) {
        if (!G._pendingWin) {
          setPhase('庄家出牌');
          G.phase = 'play';
        }
      }
      unlockHand();
      updateUI();
    });
  } else {
    setPhase('庄家出牌');
    G.phase = 'play';
    unlockHand();
    updateUI();
  }
}

/* ═══ 庄家过 ═══ */
function dealerPass() {
  console.log("[流程] dealerPass");
  actionsDealer.classList.remove('show');
  addLog(NAMES[0], '过', '');
  const fromIdx = G.lastPlayedFrom;
  const otherPlayers = [1, 2].filter(p => p !== fromIdx);
  const ch = G.lastPlayedChar;

  let found = false;
  for (const pi of otherPlayers) {
    const count = opponentHands[pi].filter(c => c === ch).length;
    if (count >= 2) {
      addLog(NAMES[pi], '碰', ch);
      setPhase(NAMES[pi] + '碰牌中');
      setTimeout(() => opponentPen(pi, ch), 800);
      found = true;
      break;
    }
  }
  if (!found) {
    setTimeout(() => passToNext(fromIdx), 400);
  }
}

/* ═══ 操作权流转 ═══ */
function passToNext(fromIdx) {
  console.log("[流程] passToNext, from=" + fromIdx + ", deckCount=" + G.deckCount);
  if (G.gameOver) return;
  const next = (fromIdx + 1) % 3;

  if (next === 0) {
    // 轮到庄家 → 摸牌
    if (G.deckCount <= 0) { endGame(); return; }
    const drawnCh = G.deck.pop();
    G.deckCount--;
    const data = parseDeckCard(drawnCh);

    addLog(NAMES[0], '摸牌', drawnCh.indexOf(':')>=0 ? drawnCh.substring(0,drawnCh.indexOf(':')) : drawnCh);
    setPhase('庄家摸牌中');

    animateDealerDraw(data, () => {
      hideTingPanel();
      // 摸牌后检测自摸/扎牌/穿牌
      if (checkDealerZhaAndHu()) return;
      setPhase('庄家出牌');
      G.phase = 'play';
      unlockHand();
      updateUI();
    });
  } else {
    // 旁家自动摸牌+出牌
    if (G.deckCount <= 0) { endGame(); return; }
    setPhase(NAMES[next] + '摸牌出牌中');
    setTimeout(() => opponentAutoPlay(next), 800);
  }
}

/* ═══ 旁家自动出牌 ═══ */
function opponentAutoPlay(playerIdx) {
  console.log("[流程] opponentAutoPlay, player=" + playerIdx + ", hand=" + opponentHands[playerIdx].length + ", deckCount=" + G.deckCount);
  if (G.gameOver) return;
  const hand = opponentHands[playerIdx];
  if (hand.length === 0) return;

  if (G.deckCount > 0) {
    var ds = G.deck.pop(); hand.push(ds.indexOf(':') >= 0 ? ds.substring(0, ds.indexOf(':')) : ds);
    G.deckCount--;
  } else { endGame(); return; }

  // 旁家摸牌后检测扎牌（4张同字暗杠 或 赖子精扎3同字+1赖子）
  const oppCounts = {};
  for (const c of hand) oppCounts[c] = (oppCounts[c] || 0) + 1;
  let zhaChar = null;
  let isWildZha = false;

  // 优先检测物理4张扎牌（价值最高）
  for (const c in oppCounts) {
    if (oppCounts[c] >= 4 && c !== '赖') { zhaChar = c; break; }
  }
  // 其次检测赖子精扎：N张三五七 + (4-N)赖子
  if (!zhaChar) {
    const wildCnt = oppCounts['赖'] || 0;
    if (wildCnt > 0) {
      // 遍历三五七，选可精扎的（物理张数+赖子>=4）
      let bestC = null, bestN = 0;
      for (const wc of ['三','五','七']) {
        const n = oppCounts[wc] || 0;
        const need = 4 - n;
        if (n >= 2 && need >= 1 && need <= wildCnt && n > bestN) { bestC = wc; bestN = n; }
      }
      if (bestC) { zhaChar = bestC; isWildZha = true; }
    }
  }

  if (zhaChar) {
    // 执行扎牌
    const removeCh = zhaChar;
    const removeN = isWildZha ? 3 : 4;
    let removed = 0;
    for (let i = hand.length - 1; i >= 0 && removed < removeN; i--) {
      if (hand[i] === removeCh) { hand.splice(i, 1); removed++; }
    }
    if (isWildZha) {
      var aiWildNeed = 4 - oppCounts[zhaChar];
      let wr = 0;
      for (let i = hand.length - 1; i >= 0 && wr < aiWildNeed; i--) {
        if (hand[i] === '赖') { hand.splice(i, 1); wr++; }
      }
    }
    const zhaCards = isWildZha
      ? [zhaChar,zhaChar,zhaChar,'赖']
      : [zhaChar,zhaChar,zhaChar,zhaChar];
    opponentMelds[playerIdx].push({ type: 'zha', cards: zhaCards, char: zhaChar, isWildZha: isWildZha });
    addOpponentMeld(playerIdx, 'zha', zhaChar);
    updateOpponentCounts();
    addLog(NAMES[playerIdx], '扎', zhaChar + (isWildZha ? '(赖)' : ''));

    // 扎牌后摸牌底，检测穿牌（摸到同字第5张）
    let chuanDone = false;
    if (G.deckCount > 0) {
      const ds2raw = G.deck.shift(); G.deckCount--;
      const ds2 = ds2raw.indexOf(':') >= 0 ? ds2raw.substring(0, ds2raw.indexOf(':')) : ds2raw;
      hand.push(ds2);
      addLog(NAMES[playerIdx], '扎后摸牌', ds2);

      // 穿牌检测：摸到同字第5张 → 穿牌升级
      // 物理扎牌：需要第5张同字；赖子精扎：物理3张已出，第4张同字即可穿
      if (ds2 === zhaChar) {
        chuanDone = true;
        // 从手牌移除穿牌字
        for (let i = hand.length - 1; i >= 0; i--) {
          if (hand[i] === zhaChar) { hand.splice(i, 1); break; }
        }
        // 赖子精穿：需要相应赖子凑5张
        if (isWildZha) {
          var chuanWildNeed = isWildZha ? 1 : 0;
          let cwr = 0;
          for (let i = hand.length - 1; i >= 0 && cwr < chuanWildNeed; i--) {
            if (hand[i] === '赖') { hand.splice(i, 1); cwr++; }
          }
        }
        // 更新melds：扎牌→穿牌
        const chuanCards = isWildZha
          ? [zhaChar,zhaChar,zhaChar,'赖',zhaChar]
          : [zhaChar,zhaChar,zhaChar,zhaChar,zhaChar];
        for (let mi = opponentMelds[playerIdx].length - 1; mi >= 0; mi--) {
          if (opponentMelds[playerIdx][mi].type === 'zha' && opponentMelds[playerIdx][mi].char === zhaChar) {
            opponentMelds[playerIdx][mi].type = 'chuan';
            opponentMelds[playerIdx][mi].cards = chuanCards;
            opponentMelds[playerIdx][mi].count = 5;
            break;
          }
        }
        // 移除旧的扎牌DOM组
        var autoCId = playerIdx === 1 ? 'melds-left' : 'melds-right';
        var autoC = document.getElementById(autoCId);
        if (autoC) {
          var oldAG = autoC.querySelectorAll('.meld-group');
          for (var agi = 0; agi < oldAG.length; agi++) {
            var aGL = oldAG[agi].querySelector('.meld-label');
            if (aGL && aGL.textContent === '扎') {
              var aGC = oldAG[agi].querySelectorAll('.card-char');
              if (aGC.length > 0 && aGC[0].textContent === zhaChar) {
                oldAG[agi].remove();
                break;
              }
            }
          }
        }
        // 移除旧的扎牌DOM组
        var autoCId = playerIdx === 1 ? 'melds-left' : 'melds-right';
        var autoC = document.getElementById(autoCId);
        if (autoC) {
          var oldAG = autoC.querySelectorAll('.meld-group');
          for (var agi = 0; agi < oldAG.length; agi++) {
            var aGL = oldAG[agi].querySelector('.meld-label');
            if (aGL && aGL.textContent === '扎') {
              var aGC = oldAG[agi].querySelectorAll('.card-char');
              if (aGC.length > 0 && aGC[0].textContent === zhaChar) {
                oldAG[agi].remove();
                break;
              }
            }
          }
        }
        addOpponentMeld(playerIdx, 'chuan', zhaChar);
        updateOpponentCounts();
        addLog(NAMES[playerIdx], '穿', zhaChar + (isWildZha ? '(赖精穿)' : ''));

        // 穿牌后再摸牌底补牌
        if (G.deckCount > 0) {
          const ds3raw = G.deck.shift(); G.deckCount--;
          const ds3 = ds3raw.indexOf(':') >= 0 ? ds3raw.substring(0, ds3raw.indexOf(':')) : ds3raw;
          hand.push(ds3);
          addLog(NAMES[playerIdx], '穿后摸牌', ds3);
        }
      }
    }

    // 扎牌/穿牌后再次检测是否有新的扎牌机会（连续扎牌）
    if (!chuanDone) {
      const reCounts = {};
      for (const c of hand) reCounts[c] = (reCounts[c] || 0) + 1;
      let reZha = null, reWild = false;
      for (const c in reCounts) {
        if (reCounts[c] >= 4 && c !== '赖') { reZha = c; break; }
      }
      if (!reZha) {
        const wC = reCounts['赖'] || 0;
        if (wC > 0) {
          let bC2 = null, bN2 = 0;
          for (const wc of ['三','五','七']) {
            const n = reCounts[wc] || 0;
            const need = 4 - n;
            if (n >= 2 && need >= 1 && need <= wC && n > bN2) { bC2 = wc; bN2 = n; }
          }
          if (bC2) { reZha = bC2; reWild = true; }
        }
      }
      if (reZha) {
        // 递归执行扎牌（此处简化：直接执行，不再递归穿牌检测）
        var rWildNeed = reWild ? (4 - (reCounts[reZha]||0)) : 0;
        const rN = reWild ? (reCounts[reZha]||0) : 4;
        let rRm = 0;
        for (let i = hand.length - 1; i >= 0 && rRm < rN; i--) {
          if (hand[i] === reZha) { hand.splice(i, 1); rRm++; }
        }
        if (reWild) {
          let rwr = 0;
          for (let i = hand.length - 1; i >= 0 && rwr < rWildNeed; i--) {
            if (hand[i] === '赖') { hand.splice(i, 1); rwr++; }
          }
        }
        const rCards = reWild
          ? [reZha,reZha,reZha,'赖']
          : [reZha,reZha,reZha,reZha];
        opponentMelds[playerIdx].push({ type: 'zha', cards: rCards, char: reZha, isWildZha: reWild });
        addOpponentMeld(playerIdx, 'zha', reZha);
        updateOpponentCounts();
        addLog(NAMES[playerIdx], '扎', reZha + (reWild ? '(赖)' : ''));
        if (G.deckCount > 0) {
          const ds4raw = G.deck.shift(); G.deckCount--;
          const ds4 = ds4raw.indexOf(':') >= 0 ? ds4raw.substring(0, ds4raw.indexOf(':')) : ds4raw;
          hand.push(ds4);
          addLog(NAMES[playerIdx], '扎后摸牌', ds4);
        }
      }
    }
  }

  const playIdx = aiPickDiscard(hand);
  const played = hand.splice(playIdx, 1)[0];
  addLog(NAMES[playerIdx], '出', played);
  G.lastPlayedChar = played;
  G.lastPlayedFrom = playerIdx;
  addDiscardCard(played, charColor(played), charVariant(played));
  updateOpponentCounts();

  setTimeout(() => checkResponseAfterOpponent(playerIdx), 500);
}

function animateDealerDraw(data, callback) {
  console.log("[流程] animateDealerDraw, char=" + data.ch + ", variant=" + data.v);

  // 清理旧的暂存牌（如果合入失败残留）
  if (G.drawnEl && G.drawnEl.parentNode) {
    G.drawnEl.remove();
    G.drawnCard = null;
    G.drawnEl = null;
  }

  const deckRect = deckZone.getBoundingClientRect();
  const flyEl = document.createElement('div');
  flyEl.className = 'card card-back deck-fly';
  flyEl.innerHTML = '<span class="card-back-text">花</span>';
  // 用fixed定位做飞行动画（视口坐标）
  flyEl.style.position = 'fixed';
  flyEl.style.width = '28px';
  flyEl.style.height = '40px';
  flyEl.style.left = (deckRect.left + deckRect.width/2 - 14) + 'px';
  flyEl.style.top = (deckRect.top + deckRect.height/2 - 20) + 'px';
  flyEl.style.zIndex = '200';
  flyEl.style.transition = 'all 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
  flyEl.style.pointerEvents = 'none';
  document.body.appendChild(flyEl);

  const handRect = handZone.getBoundingClientRect();
  const targetX = handRect.right - CARD_W - 10;
  const targetY = handRect.bottom - CARD_H - 10;

  // 飞到右下角
  setTimeout(() => {
    flyEl.style.left = targetX + 'px';
    flyEl.style.top = targetY + 'px';
    flyEl.style.width = CARD_W + 'px';
    flyEl.style.height = CARD_H + 'px';
  }, 50);

  // 翻牌动画（飞行中段）
  setTimeout(() => {
    flyEl.style.transform = 'scaleX(0)';
    setTimeout(() => {
      const v = data.v || '';
      flyEl.className = 'card deck-fly' + (v ? ' ' + v : '') + (data.v === 'flower' ? ' v-flower' : '');
      flyEl.innerHTML = '<span class="card-char ' + data.c + '">' + data.ch + '</span>';
      flyEl.style.transform = 'scaleX(1)';
    }, 150);
  }, 300);

  // 到达后：移入handZone作为暂存牌
  setTimeout(() => {
    if (!flyEl.parentNode) return;
    flyEl.remove();

    // 在handZone中创建暂存牌
    const stayEl = document.createElement('div');
    const v = data.v || '';
    stayEl.className = 'card just-drawn' + (v ? ' ' + v : '') + (data.v === 'flower' ? ' v-flower' : '');
    stayEl.innerHTML = '<span class="card-char ' + data.c + '">' + data.ch + '</span>';
    stayEl.style.position = 'absolute';
    stayEl.style.left = (handZone.offsetWidth - CARD_W - 10) + 'px';
    stayEl.style.top = (handZone.offsetHeight - CARD_H - 10) + 'px';
    stayEl.style.zIndex = '50';
    stayEl.dataset.ch = data.ch;
    stayEl.dataset.color = data.c;
    stayEl.dataset.variant = data.v || '';
    stayEl.style.pointerEvents = 'auto';
    stayEl.style.cursor = 'pointer';
    handZone.appendChild(stayEl);

    G.drawnCard = data;
    G.drawnEl = stayEl;

    // 注册出牌事件
    stayEl.addEventListener('dblclick', function(ev) {
      ev.stopPropagation();
      if (!G.locked && !G.gameOver) playCard(stayEl);
    });
    stayEl.addEventListener('mousedown', function(ev) {
      ev.preventDefault();
      dragStartPos = {x:ev.clientX, y:ev.clientY};
      beginDrag(stayEl, ev.clientX, ev.clientY);
    });
    stayEl.addEventListener('touchstart', function(ev) {
      ev.preventDefault();
      const t = ev.touches[0];
      dragStartPos = {x:t.clientX, y:t.clientY};
      beginDrag(stayEl, ev.clientX, ev.clientY);
    }, {passive:false});

    updateDeckVisual();
    if (callback) callback();
  }, 600);
}

// 修改dealerPen：记录碰牌到dealerMelds，支持泛牌模式
const _origDealerPen = dealerPen;
dealerPen = function() {
  // 泛牌模式：扎牌+旁家出同字+庄家手中2张→泛牌
  if (G._pendingFan) {
    const ch = G._pendingFan;
    G._pendingFan = null;
    actionsDealer.classList.remove('show');
    document.getElementById('btn-pen').style.display = 'none';
    document.getElementById('btn-pass').style.display = 'none';

    // 从手牌+暂存牌中取出2张该字
    let removed = 0;
    for (let i = handCards.length - 1; i >= 0 && removed < 2; i--) {
      if (handCards[i].ch === ch) {
        handCards.splice(i, 1);
        const el = cardEls.splice(i, 1)[0];
        if (el && el.parentNode === handZone) handZone.removeChild(el);
        removed++;
      }
    }
    if (removed < 2 && G.drawnCard && G.drawnCard.ch === ch) {
      handCards.push(G.drawnCard);
      const dEl = G.drawnEl;
      if (dEl && dEl.parentNode === handZone) { handZone.removeChild(dEl); }
      G.drawnCard = null; G.drawnEl = null;
      rearrangeHand();
      const extraIdx = handCards.findIndex(c => c.ch === ch);
      if (extraIdx !== -1) {
        handCards.splice(extraIdx, 1);
        const el2 = cardEls.splice(extraIdx, 1)[0];
        if (el2 && el.parentNode === handZone) handZone.removeChild(el2);
        removed++;
      }
    }

    // 取弃牌池中的牌
    const lastDiscard = discardPool.lastElementChild;
    if (lastDiscard) lastDiscard.remove();

    // 升级扎牌为泛牌
    var zhaFanCards = null;
    for (var mi = G.dealerMelds.length - 1; mi >= 0; mi--) {
      if (G.dealerMelds[mi].type === 'zha' && G.dealerMelds[mi].char === ch) {
        G.dealerMelds[mi] = { type: 'fan', char: ch, count: 5, cards: G.dealerMelds[mi].cards };
        zhaFanCards = G.dealerMelds[mi].cards;
        break;
      }
    }

    addDealerMeld('fan', ch, ch, zhaFanCards);
    addLog(NAMES[0], '泛', ch);

    // 泛牌后摸牌顶
    if (G.deckCount > 0) {
      var drawnCh = G.deck.pop();
      G.deckCount--;
      var data = parseDeckCard(drawnCh);
      addLog(NAMES[0], '泛后摸牌', drawnCh.indexOf(':')>=0 ? drawnCh.substring(0,drawnCh.indexOf(':')) : drawnCh);
      setPhase('庄家摸牌中');
      animateDealerDraw(data, function() {
        setPhase('庄家出牌');
        G.phase = 'play';
        unlockHand();
        updateUI();
      });
    } else {
      setPhase('庄家出牌');
      G.phase = 'play';
      unlockHand();
      updateUI();
    }
    return;
  }

  // _origDealerPen() 内部已完整构建penCards并push到G.dealerMelds，不再重复
  _origDealerPen();
};

// 黑精: key=(skin_black, flower_black) → 胡数(非主精), 主精翻倍

// 分类牌面: 返回 {sr,fr,sb,fb,w,n}
function _classify(cards) {
  let sr=0,fr=0,sb=0,fb=0,w=0,n=0;
  for (const c of cards) {
    if (c.isWild) { w++; continue; }
    const isFlower = c.v === 'flower';
    if (c.isJin) {
      if (RED_JING.has(c.ch)) { if (isFlower) fr++; else sr++; }
      else { if (isFlower) fb++; else sb++; }
    } else { n++; }
  }
  return {sr,fr,sb,fb,w,n};
}

function _lookup(cards, numCards, isMain) {
  // 含精牌查表: 函数计算替代查表, 支持所有(sr,fr,w)排列组合
  // 胡数计算:
  //   红精: 皮精+1/张, 花精+2/张, 赖子+2/张; 主精时翻倍
  //   黑精: 皮精+0/张, 花精+1/张, 赖子+2/张; 主精时翻倍
  const cl = _classify(cards);
  const rt = cl.sr + cl.fr;
  const bt = cl.sb + cl.fb;
  if (rt > 0 && bt > 0) return 0; // 不应混红黑精
  let base = 0;
  if (rt > 0) {
    // 红精: 皮精+1/张, 花精+2/张, 赖子+2/张
    base = cl.sr * 1 + cl.fr * 2 + cl.w * 2;
  } else if (bt > 0) {
    // 黑精: 皮精+0/张, 花精+1/张, 赖子+2/张
    base = cl.sb * 0 + cl.fb * 1 + cl.w * 2;
  } else {
    return 0;
  }
  return isMain ? base * 2 : base;
}
