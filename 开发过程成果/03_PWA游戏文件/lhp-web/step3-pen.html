<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>公安花牌 - Step3 碰牌响应</title>
<style>
  :root {
    --table-bg: #1a472a;
    --table-felt: #2d6a3f;
    --card-bg: #f5f0e1;
    --card-shadow: rgba(0,0,0,0.3);
    --red: #b91c1c;
    --black: #1a1a1a;
    --gold: #b8860b;
    --gold-light: #daa520;
    --radius: 5px;
    --font-cn: "KaiTi", "STKaiti", "FangSong", serif;
    --font-display: "Noto Serif SC", "SimSun", serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 100vw; height: 100vh; overflow: hidden;
    background: var(--table-bg);
    background-image: radial-gradient(ellipse at 50% 50%, var(--table-felt) 0%, var(--table-bg) 75%);
    font-family: var(--font-cn);
    color: #e8e0d0;
  }
  .table { width: 100%; height: 100%; position: relative; }

  /* ═══════ 牌面 ═══════ */
  .card {
    width: 40px; height: 56px; background: var(--card-bg);
    border-radius: var(--radius); border: 1px solid #d4c9a8;
    display: inline-flex; flex-direction: column; align-items: center; justify-content: center;
    position: absolute; cursor: default;
    box-shadow: 0 1px 3px var(--card-shadow), inset 0 1px 0 rgba(255,255,255,0.5);
    user-select: none; z-index: 1;
  }
  .card::before {
    content: ""; position: absolute; inset: 2px;
    border: 0.5px solid rgba(180,160,120,0.25); border-radius: 3px; pointer-events: none;
  }
  .card-char { font-size: 20px; font-weight: 700; font-family: var(--font-display); line-height: 1; }
  .card-char.red   { color: var(--red); }
  .card-char.black { color: var(--black); }
  .card.hua { background: linear-gradient(160deg, #fffbeb 0%, #fef3c7 40%, #fde68a 100%); border-color: #e5b84c; }
  .card.hua::before { border-color: rgba(184,134,11,0.25); }
  .card.laizi {
    background: linear-gradient(160deg, #fef3c7 0%, #fde68a 50%, #fbbf24 100%);
    border-color: var(--gold);
  }
  .card.laizi .card-char {
    background: linear-gradient(180deg, var(--red), var(--gold));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text; font-size: 22px;
  }
  .card-back { background: linear-gradient(135deg, #7c3aed, #4c1d95); border-color: #5b21b6; }
  .card-back::before { border-color: rgba(167,139,250,0.3); }
  .card-back-text { font-size: 14px; color: rgba(255,255,255,0.3); font-family: var(--font-display); }

  .card.in-hand { cursor: grab; }
  .card.in-hand.locked { cursor: not-allowed; opacity: 0.7; pointer-events: none; }
  .card.in-hand:not(.locked):hover { box-shadow: 0 4px 12px var(--card-shadow); z-index: 5; }
  .card.in-hand:active { cursor: grabbing; }
  .card.dragging { z-index: 100; box-shadow: 0 8px 24px rgba(0,0,0,0.5); transform: scale(1.06); cursor: grabbing; }
  .card.grouped { box-shadow: 0 0 0 2px rgba(59,130,246,0.6), 0 2px 8px var(--card-shadow); }

  .card.flying { position: fixed !important; z-index: 200; transition: all 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94); pointer-events: none; }
  .card.just-played { box-shadow: 0 0 0 2px #fbbf24, 0 0 12px rgba(251,191,36,0.4); z-index: 2; }

  /* 明牌组 */
  .meld-group {
    display: inline-flex; gap: 2px; padding: 4px 6px;
    background: rgba(0,0,0,0.12); border-radius: 6px;
    border: 1px dashed rgba(255,255,255,0.06);
  }
  .meld-group .card { position: relative; cursor: default; }
  .meld-group .card + .card { margin-left: 2px; }
  .meld-group .card.open-pen::after,
  .meld-group .card.open-zhao::after {
    content: ""; position: absolute; bottom: -3px; left: 3px; right: 3px;
    height: 3px; border-radius: 0 0 4px 4px;
  }
  .meld-group .card.open-pen::after  { background: #22c55e; }
  .meld-group .card.open-zhao::after { background: #3b82f6; }
  .melds-col { display: flex; flex-direction: column; gap: 5px; }
  .melds-col.rotated { transform: rotate(180deg); transform-origin: top center; }

  /* ═══════ 庄家手牌区 ═══════ */
  .hand-zone {
    position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
    width: 70vw; height: 160px;
    background: rgba(234,179,8,0.06);
    border: 1px dashed rgba(234,179,8,0.15);
    border-radius: 8px; overflow: visible;
  }
  .hand-zone-hint {
    position: absolute; top: 4px; left: 10px;
    font-size: 10px; color: rgba(234,179,8,0.35); pointer-events: none;
  }
  .hand-zone.locked { border-color: rgba(234,179,8,0.08); background: rgba(234,179,8,0.02); }

  /* ═══════ 其它区域 ═══════ */
  .z-deck {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 8px;
    background: rgba(0,0,0,0.3); padding: 6px 14px; border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.06); z-index: 15;
  }
  .draw-pile { display: flex; gap: 1px; }
  .draw-pile .card { width: 28px; height: 40px; position: relative; }
  .draw-pile .card-back-text { font-size: 10px; }
  .draw-count { font-size: 13px; color: var(--gold-light); font-weight: 600; }

  .z-discard {
    position: absolute; top: 38%; left: 50%; transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.1); border-radius: 10px;
    border: 1px dashed rgba(255,255,255,0.08);
    padding: 8px 10px; display: flex; flex-wrap: wrap; gap: 1px; align-content: flex-start;
    z-index: 5; min-width: 80px; min-height: 50px;
  }
  .z-discard .card { width: 30px; height: 42px; position: relative; margin: 1px; }
  .z-discard .card-char { font-size: 15px; }

  .z-game-status {
    position: absolute; top: 12px; left: 15%;
    background: rgba(0,0,0,0.45); backdrop-filter: blur(6px);
    padding: 10px 14px; border-radius: 8px;
    font-size: 12px; line-height: 1.8;
    border: 1px solid rgba(255,255,255,0.08);
    z-index: 20; min-width: 140px;
  }
  .z-game-status .label { color: rgba(245,240,225,0.45); }
  .z-game-status .val { color: var(--gold-light); font-weight: 600; }
  .z-game-status .val.waiting { color: #ef4444; animation: blink 1s step-end infinite; }
  @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.5;} }

  .log-bar {
    position: absolute; top: 12px; right: 15%;
    background: rgba(0,0,0,0.45); backdrop-filter: blur(6px);
    padding: 6px 12px; border-radius: 8px;
    font-size: 11px; line-height: 1.6;
    border: 1px solid rgba(255,255,255,0.08);
    z-index: 20; max-width: 200px; color: rgba(245,240,225,0.6);
  }
  .log-bar .log-title { font-weight: 700; color: var(--gold-light); font-size: 11px; margin-bottom: 2px; }
  .log-bar .log-item { padding: 1px 0; }
  .log-bar .log-who { color: rgba(245,240,225,0.8); font-weight: 600; }
  .log-bar .log-act { color: var(--gold-light); }

  .player-info {
    position: absolute;
    background: rgba(0,0,0,0.45); backdrop-filter: blur(6px);
    padding: 8px 12px; border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.08);
    z-index: 15; font-size: 12px; line-height: 1.6;
  }
  .player-info .p-name { font-weight: 700; color: #e8e0d0; }
  .player-info .p-stats { color: rgba(245,240,225,0.5); font-size: 11px; }
  .player-info .p-stats span { color: var(--gold-light); font-weight: 600; }
  .player-info.active { border-color: var(--gold); }
  .player-info.active .p-name { color: var(--gold-light); }

  .side-hand-zone {
    position: absolute; width: 150px; height: 340px;
    display: flex; align-items: center; justify-content: center; z-index: 10;
  }
  .side-hand-zone .hand { display: flex; align-items: center; transform: rotate(180deg); }
  .side-hand-zone .hand .card + .card { margin-left: -10px; }

  .side-meld-zone {
    position: absolute; width: 100px; height: 340px;
    display: flex; align-items: flex-start; justify-content: center; padding-top: 6px;
    z-index: 10;
  }

  .z-meld-bottom {
    position: absolute; bottom: 175px; left: 50%; transform: translateX(-50%);
    width: 420px;
    display: flex; align-items: flex-start; justify-content: center; padding-top: 4px;
    z-index: 10;
  }

  /* ═══════ 操作按钮 ═══════ */
  .action-panel {
    position: absolute; z-index: 30;
    display: none; gap: 4px;
    background: rgba(0,0,0,0.6); backdrop-filter: blur(6px);
    padding: 6px 10px; border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.12);
  }
  .action-panel.show { display: flex; }
  .act-btn {
    background: rgba(0,0,0,0.65); backdrop-filter: blur(4px);
    color: #f5f0e1; border: 1px solid rgba(255,255,255,0.15);
    padding: 3px 14px; border-radius: 4px;
    font-size: 13px; font-family: var(--font-cn);
    cursor: pointer; transition: all 0.15s; white-space: nowrap;
  }
  .act-btn:hover { background: rgba(0,0,0,0.85); border-color: var(--gold-light); color: var(--gold-light); }
  .act-btn.highlight {
    background: rgba(217,119,6,0.85); border-color: var(--gold); color: #fff;
    animation: pulse 0.8s infinite;
  }
  @keyframes pulse {
    0%,100% { box-shadow: 0 0 0 0 rgba(217,119,6,0.4); }
    50% { box-shadow: 0 0 8px 2px rgba(217,119,6,0.6); }
  }
  /* 碰牌按钮位置 */
  .panel-bottom { bottom: 175px; left: 50%; transform: translateX(-50%); }

  .tip-bar {
    position: absolute; bottom: 174px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
    padding: 4px 14px; border-radius: 5px;
    font-size: 11px; color: rgba(245,240,225,0.5);
    z-index: 25; pointer-events: none; white-space: nowrap;
    transition: opacity 0.5s;
  }
</style>
</head>
<body>
<div class="table">

  <!-- 余牌区 -->
  <div class="z-deck">
    <div class="draw-count">余牌 <span id="deck-count">36</span></div>
    <div class="draw-pile">
      <div class="card card-back"><span class="card-back-text">花</span></div>
      <div class="card card-back"><span class="card-back-text">花</span></div>
      <div class="card card-back"><span class="card-back-text">花</span></div>
    </div>
  </div>

  <!-- 游戏状态 -->
  <div class="z-game-status">
    <div><span class="label">局数:</span> <span class="val">第1局</span></div>
    <div><span class="label">回合:</span> <span class="val" id="round-num">0</span></div>
    <div><span class="label">阶段:</span> <span class="val" id="phase-text">庄家出牌</span></div>
    <div><span class="label">主精:</span> <span class="val">五(花精)</span></div>
    <div><span class="label">副精:</span> <span class="val">无</span></div>
  </div>

  <!-- 操作日志 -->
  <div class="log-bar">
    <div class="log-title">操作记录</div>
    <div id="log-list"></div>
  </div>

  <!-- 弃牌区 -->
  <div class="z-discard" id="discard-pool"></div>

  <!-- 上家 -->
  <div class="player-info" id="pi-right" style="top:12px;right:12px;">
    <div class="p-name">上家</div>
    <div class="p-stats">手牌 <span id="right-count">25</span> + 明牌 <span id="right-meld">0</span></div>
  </div>
  <div class="side-meld-zone" style="top:14%;right:170px;" id="melds-right"></div>
  <div class="side-hand-zone" style="top:14%;right:12px;">
    <div class="hand" id="hand-right"></div>
  </div>

  <!-- 下家 -->
  <div class="player-info" id="pi-left" style="top:12px;left:12px;">
    <div class="p-name">下家</div>
    <div class="p-stats">手牌 <span id="left-count">25</span> + 明牌 <span id="left-meld">0</span></div>
  </div>
  <div class="side-hand-zone" style="top:14%;left:12px;">
    <div class="hand" id="hand-left"></div>
  </div>
  <div class="side-meld-zone" style="top:14%;left:170px;" id="melds-left"></div>

  <!-- 庄家信息 -->
  <div class="player-info active" id="pi-bottom" style="bottom:8px;left:2%;">
    <div class="p-name">庄家(你)</div>
    <div class="p-stats">手牌 <span id="hand-count">26</span></div>
  </div>

  <!-- 庄家明牌区 -->
  <div class="z-meld-bottom" id="melds-bottom"></div>

  <!-- 庄家操作按钮(碰牌响应等) -->
  <div class="action-panel panel-bottom" id="actions-dealer">
    <button class="act-btn highlight" onclick="dealerPen()">碰</button>
    <button class="act-btn" onclick="dealerPass()">过</button>
  </div>

  <!-- 庄家手牌区 -->
  <div class="hand-zone" id="hand-zone">
    <span class="hand-zone-hint">拖动整理 | 双击出牌</span>
  </div>

  <!-- 操作提示 -->
  <div class="tip-bar" id="tip-bar">双击手牌打出，出牌后等待旁家响应</div>

</div>

<script>
/* ═══════════════════════════════════════════════════
   Step3: 操作权流转 + 碰牌响应 + 旁家自动模拟
   ═══════════════════════════════════════════════════ */

const CARD_W = 40, CARD_H = 56, STEP_X = 36;
const handZone = document.getElementById('hand-zone');
const discardPool = document.getElementById('discard-pool');
const tipBar = document.getElementById('tip-bar');
const actionsDealer = document.getElementById('actions-dealer');

/* ═══ 游戏状态机 ═══ */
const G = {
  round: 0,
  // 座位: 0=庄家(你), 1=下家, 2=上家
  currentPlayer: 0,
  phase: 'play',       // play | waiting_response | response | opponent_turn | draw
  deckCount: 36,
  locked: false,       // 庄家手牌是否锁定
  lastPlayedChar: null, // 最近打出的字面
  lastPlayedFrom: -1,   // 谁打出的
};

const NAMES = ['庄家(你)', '下家', '上家'];

// 庄家手牌
const handCards = [
  {ch:'三',c:'red',v:'hua'},{ch:'上',c:'red'},{ch:'上',c:'red'},
  {ch:'乙',c:'black',v:'hua'},{ch:'乙',c:'black'},{ch:'二',c:'black'},
  {ch:'二',c:'black'},{ch:'人',c:'red'},{ch:'人',c:'red'},{ch:'人',c:'red'},
  {ch:'八',c:'black'},{ch:'八',c:'black'},{ch:'六',c:'black'},
  {ch:'十',c:'black'},{ch:'千',c:'black'},{ch:'可',c:'red'},
  {ch:'四',c:'black'},{ch:'土',c:'black'},{ch:'大',c:'red'},
  {ch:'子',c:'black'},{ch:'孔',c:'black'},{ch:'已',c:'black'},
  {ch:'知',c:'red'},{ch:'知',c:'red'},{ch:'礼',c:'red'},
  {ch:'赖',c:'red',v:'laizi'},
];

// 旁家手牌(模拟用，字面分布)
const opponentHands = {
  1: ['七','三','上','乙','九','二','五','五','人','人','八','六','十','可','可','四','土','子','礼','礼','礼','化','化','大','赖'],
  2: ['上','九','五','人','八','八','八','六','六','化','化','十','十','千','土','大','已','知','知','礼','孔','孔','孔','子','子'],
};

// 旁家明牌
const opponentMelds = { 1: [], 2: [] };

const cardEls = [];

/* ═══ 创建牌面 ═══ */
function createCardEl(data, x, y) {
  const el = document.createElement('div');
  const v = data.v === 'hua' ? 'hua' : (data.v === 'laizi' ? 'laizi' : '');
  el.className = 'card in-hand' + (v ? ' ' + v : '') + (G.locked ? ' locked' : '');
  el.innerHTML = `<span class="card-char ${data.c}">${data.ch}</span>`;
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  el.dataset.char = data.ch;
  el.dataset.color = data.c;
  el.dataset.variant = data.v || '';
  el.addEventListener('mousedown', onDown);
  el.addEventListener('touchstart', onTouchDown, { passive: false });
  el.addEventListener('dblclick', onDblClick);
  cardEls.push(el);
  handZone.appendChild(el);
  return el;
}

function layoutInitial() {
  const zW = handZone.offsetWidth, zH = handZone.offsetHeight;
  const perRow = Math.min(handCards.length, Math.floor((zW - 10) / STEP_X));
  const rows = Math.ceil(handCards.length / perRow);
  const startY = zH - rows * (CARD_H + 6) - 8;
  const startX = (zW - perRow * STEP_X + (STEP_X - CARD_W)) / 2;
  handCards.forEach((d, i) => {
    const row = Math.floor(i / perRow), col = i % perRow;
    createCardEl(d, startX + col * STEP_X, startY + row * (CARD_H + 6));
  });
  updateUI();
}

/* ═══ 锁定/解锁手牌 ═══ */
function lockHand() {
  G.locked = true;
  handZone.classList.add('locked');
  cardEls.forEach(el => el.classList.add('locked'));
}
function unlockHand() {
  G.locked = false;
  handZone.classList.remove('locked');
  cardEls.forEach(el => el.classList.remove('locked'));
}

/* ═══ 拖动(不受锁定影响，始终可拖动整理) ═══ */
let drag = null, dragMoved = false, dragStartPos = null;
function onDown(e) { e.preventDefault(); dragStartPos = {x:e.clientX,y:e.clientY}; beginDrag(e.currentTarget, e.clientX, e.clientY); }
function onTouchDown(e) { e.preventDefault(); const t=e.touches[0]; dragStartPos = {x:t.clientX,y:t.clientY}; beginDrag(e.currentTarget, t.clientX, t.clientY); }
function beginDrag(el, cx, cy) {
  const r = handZone.getBoundingClientRect();
  drag = { el, ox: cx-r.left-parseFloat(el.style.left), oy: cy-r.top-parseFloat(el.style.top) };
  dragMoved = false;
  el.classList.add('dragging');
}
function onMove(cx, cy) {
  if (!drag) return;
  const r = handZone.getBoundingClientRect();
  let x = cx-r.left-drag.ox, y = cy-r.top-drag.oy;
  const m = CARD_W*0.6;
  x = Math.max(-m, Math.min(handZone.offsetWidth-CARD_W+m, x));
  y = Math.max(-m, Math.min(handZone.offsetHeight-CARD_H+m, y));
  drag.el.style.left = x+'px'; drag.el.style.top = y+'px';
  if (Math.abs(cx-dragStartPos.x)+Math.abs(cy-dragStartPos.y)>5) dragMoved = true;
  if (dragMoved) highlightNearby(drag.el);
}
document.addEventListener('mousemove', e => onMove(e.clientX, e.clientY));
document.addEventListener('touchmove', e => { if(drag){e.preventDefault();onMove(e.touches[0].clientX,e.touches[0].clientY);} }, {passive:false});
function endDrag() {
  if (!drag) return;
  drag.el.classList.remove('dragging');
  if (dragMoved) snapToGroup(drag.el);
  clearHighlights(); drag = null;
}
document.addEventListener('mouseup', endDrag);
document.addEventListener('touchend', endDrag);
function highlightNearby(dragEl) {
  const dx=parseFloat(dragEl.style.left), dy=parseFloat(dragEl.style.top), ch=dragEl.dataset.char;
  cardEls.forEach(el => {
    if(el===dragEl){el.classList.remove('grouped');return;}
    const dist=Math.hypot(dx-parseFloat(el.style.left),dy-parseFloat(el.style.top));
    el.classList.toggle('grouped',dist<CARD_W*1.8&&el.dataset.char===ch);
  });
}
function clearHighlights() { cardEls.forEach(el => el.classList.remove('grouped')); }
function snapToGroup(dragEl) {
  const dx=parseFloat(dragEl.style.left),dy=parseFloat(dragEl.style.top),ch=dragEl.dataset.char;
  let best=null,bestDist=Infinity;
  cardEls.forEach(el => {
    if(el===dragEl||el.dataset.char!==ch)return;
    const dist=Math.hypot(dx-parseFloat(el.style.left),dy-parseFloat(el.style.top));
    if(dist<bestDist){bestDist=dist;best=el;}
  });
  if(best&&bestDist<CARD_W*2.5){
    const tx=parseFloat(best.style.left),ty=parseFloat(best.style.top);
    dragEl.style.left=(dx>tx?tx+STEP_X:Math.max(0,tx-STEP_X))+'px';
    dragEl.style.top=(dx>tx?ty+2:Math.max(0,ty-2))+'px';
    dragEl.style.zIndex='2';
  }
}

/* ═══ 双击出牌（仅未锁定时可出） ═══ */
function onDblClick(e) {
  if (dragMoved || G.locked) return;
  const el = e.currentTarget;
  playCard(el);
}

function playCard(el) {
  lockHand();

  const srcRect = el.getBoundingClientRect();
  const char = el.dataset.char, color = el.dataset.color, variant = el.dataset.variant;

  const idx = cardEls.indexOf(el);
  if (idx === -1) return;
  cardEls.splice(idx, 1);
  handCards.splice(idx, 1);
  handZone.removeChild(el);

  G.round++;
  updateUI();

  // 飞行动画
  const flyEl = document.createElement('div');
  const v = variant === 'hua' ? 'hua' : (variant === 'laizi' ? 'laizi' : '');
  flyEl.className = 'card flying' + (v ? ' ' + v : '');
  flyEl.innerHTML = `<span class="card-char ${color}">${char}</span>`;
  flyEl.style.left = srcRect.left+'px'; flyEl.style.top = srcRect.top+'px';
  flyEl.style.width = srcRect.width+'px'; flyEl.style.height = srcRect.height+'px';
  document.body.appendChild(flyEl);

  const tgtRect = discardPool.getBoundingClientRect();
  requestAnimationFrame(() => requestAnimationFrame(() => {
    flyEl.style.left = (tgtRect.left+tgtRect.width/2-15)+'px';
    flyEl.style.top = (tgtRect.top+tgtRect.height/2-21)+'px';
    flyEl.style.width = '30px'; flyEl.style.height = '42px'; flyEl.style.opacity = '0.85';
  }));
  flyEl.addEventListener('transitionend', () => {
    flyEl.remove();
    addDiscardCard(char, color, variant);
    // 出牌完成 → 检查旁家响应
    G.lastPlayedChar = char;
    G.lastPlayedFrom = 0;
    checkOpponentResponse();
  }, {once:true});

  addLog(NAMES[0], '出', char);
  setPhase('等待响应');
}

function addDiscardCard(char, color, variant) {
  const prev = discardPool.querySelector('.just-played');
  if (prev) prev.classList.remove('just-played');
  const el = document.createElement('div');
  const v = variant === 'hua' ? 'hua' : (variant === 'laizi' ? 'laizi' : '');
  el.className = 'card just-played' + (v ? ' ' + v : '');
  el.innerHTML = `<span class="card-char ${color}">${char}</span>`;
  el.style.position = 'relative';
  discardPool.appendChild(el);
}

/* ═══ 旁家响应检测 ═══ */
function checkOpponentResponse() {
  const ch = G.lastPlayedChar;
  const from = G.lastPlayedFrom;

  // 检查上家和下家手中是否有2张以上同字面（可碰）
  // 优先级：按座位顺序 1(下家) → 2(上家)
  for (const pi of [1, 2]) {
    const count = opponentHands[pi].filter(c => c === ch).length;
    if (count >= 2) {
      addLog(NAMES[pi], '碰', ch);
      // 旁家自动碰牌
      setTimeout(() => opponentPen(pi, ch), 800);
      return;
    }
  }

  // 没人碰 → 检查庄家是否可碰（如果别人打出的牌）
  // 这里简化：没人碰就轮到下一家
  addLog('', '无人响应', '');
  setTimeout(() => passToNext(from), 600);
}

/* ═══ 旁家自动碰牌 ═══ */
function opponentPen(playerIdx, char) {
  const hand = opponentHands[playerIdx];
  // 从手中取出2张
  let removed = 0;
  for (let i = hand.length - 1; i >= 0 && removed < 2; i--) {
    if (hand[i] === char) { hand.splice(i, 1); removed++; }
  }
  // 从弃牌池移除打出的那张
  const lastDiscard = discardPool.lastElementChild;
  if (lastDiscard) lastDiscard.remove();

  // 添加明牌
  opponentMelds[playerIdx].push({ type: 'pen', cards: [char, char, char] });

  // 更新旁家牌背数
  updateOpponentCounts();

  // 碰牌后该玩家摸一张牌（从余牌池）
  G.deckCount--;
  document.getElementById('deck-count').textContent = G.deckCount;

  addLog(NAMES[playerIdx], '碰牌完成，摸牌', '');

  // 碰牌者获得出牌权，自动出一张
  setTimeout(() => {
    if (hand.length > 0) {
      const playIdx = Math.floor(Math.random() * hand.length);
      const played = hand.splice(playIdx, 1)[0];
      addLog(NAMES[playerIdx], '出', played);
      G.lastPlayedChar = played;
      G.lastPlayedFrom = playerIdx;
      addDiscardCard(played, played === '三' || played === '五' || played === '七' || played === '乙' || played === '九' ? 'red' : 'black', '');
      updateOpponentCounts();

      // 检查下一个旁家或庄家是否可碰
      setTimeout(() => checkResponseAfterOpponent(playerIdx), 500);
    }
  }, 800);
}

/* ═══ 旁家出牌后检查响应 ═══ */
function checkResponseAfterOpponent(fromIdx) {
  const ch = G.lastPlayedChar;

  // 检查庄家是否可碰
  const dealerCount = handCards.filter(c => c.ch === ch).length;
  if (dealerCount >= 2) {
    setPhase('等待你响应');
    // 显示碰牌按钮
    actionsDealer.classList.add('show');
    return;
  }

  // 检查另一个旁家
  const otherPlayers = [1, 2].filter(p => p !== fromIdx);
  for (const pi of otherPlayers) {
    const count = opponentHands[pi].filter(c => c === ch).length;
    if (count >= 2) {
      addLog(NAMES[pi], '碰', ch);
      setTimeout(() => opponentPen(pi, ch), 800);
      return;
    }
  }

  // 都不碰 → 按顺序流转
  setTimeout(() => passToNext(fromIdx), 400);
}

/* ═══ 庄家碰牌 ═══ */
function dealerPen() {
  actionsDealer.classList.remove('show');
  const ch = G.lastPlayedChar;

  // 从手牌取出2张
  let removed = 0;
  for (let i = handCards.length - 1; i >= 0 && removed < 2; i--) {
    if (handCards[i].ch === ch) {
      handCards.splice(i, 1);
      const el = cardEls.splice(i, 1)[0];
      if (el) handZone.removeChild(el);
      removed++;
    }
  }

  // 从弃牌池移除
  const lastDiscard = discardPool.lastElementChild;
  if (lastDiscard) lastDiscard.remove();

  // 添加庄家明牌
  addDealerMeld('pen', ch);
  addLog(NAMES[0], '碰', ch);

  // 摸牌
  G.deckCount--;
  document.getElementById('deck-count').textContent = G.deckCount;

  // 碰牌者获得出牌权 → 解锁庄家手牌
  setPhase('庄家出牌');
  unlockHand();
  updateUI();
}

/* ═══ 庄家过(不碰) ═══ */
function dealerPass() {
  actionsDealer.classList.remove('show');
  addLog(NAMES[0], '过', '');
  // 不碰 → 按顺序检查下一个旁家，或流转
  const fromIdx = G.lastPlayedFrom;
  const otherPlayers = [1, 2].filter(p => p !== fromIdx);
  const ch = G.lastPlayedChar;

  let found = false;
  for (const pi of otherPlayers) {
    const count = opponentHands[pi].filter(c => c === ch).length;
    if (count >= 2) {
      addLog(NAMES[pi], '碰', ch);
      setTimeout(() => opponentPen(pi, ch), 800);
      found = true;
      break;
    }
  }
  if (!found) {
    setTimeout(() => passToNext(fromIdx), 400);
  }
}

/* ═══ 操作权流转 ═══ */
function passToNext(fromIdx) {
  // 下一个玩家：fromIdx+1%3
  const next = (fromIdx + 1) % 3;

  if (next === 0) {
    // 轮到庄家 → 摸牌 + 解锁
    G.deckCount--;
    document.getElementById('deck-count').textContent = G.deckCount;
    setPhase('庄家出牌');
    unlockHand();
    addLog(NAMES[0], '摸牌', '');
  } else {
    // 旁家自动摸牌+出牌
    setPhase(NAMES[next] + '出牌');
    setTimeout(() => opponentAutoPlay(next), 800);
  }
}

/* ═══ 旁家自动出牌 ═══ */
function opponentAutoPlay(playerIdx) {
  const hand = opponentHands[playerIdx];
  if (hand.length === 0) return;

  // 摸牌
  G.deckCount--;
  document.getElementById('deck-count').textContent = G.deckCount;

  // 随机出一张
  const playIdx = Math.floor(Math.random() * hand.length);
  const played = hand.splice(playIdx, 1)[0];
  addLog(NAMES[playerIdx], '出', played);

  G.lastPlayedChar = played;
  G.lastPlayedFrom = playerIdx;
  addDiscardCard(played, 'black', '');
  updateOpponentCounts();

  // 检查响应
  setTimeout(() => checkResponseAfterOpponent(playerIdx), 500);
}

/* ═══ 庄家明牌渲染 ═══ */
function addDealerMeld(type, char) {
  const container = document.getElementById('melds-bottom');
  if (!container.querySelector('.melds-col')) {
    const wrap = document.createElement('div');
    wrap.className = 'melds-col';
    wrap.style.display = 'flex';
    wrap.style.gap = '5px';
    container.appendChild(wrap);
  }
  const wrap = container.querySelector('.melds-col');
  const g = document.createElement('div');
  g.className = 'meld-group';
  const cls = type === 'pen' ? 'open-pen' : (type === 'zhao' ? 'open-zhao' : '');
  for (let i = 0; i < 3; i++) {
    const c = document.createElement('div');
    c.className = 'card ' + cls;
    c.innerHTML = `<span class="card-char black">${char}</span>`;
    g.appendChild(c);
  }
  wrap.appendChild(g);
}

/* ═══ UI更新 ═══ */
function updateUI() {
  document.getElementById('hand-count').textContent = handCards.length;
  document.getElementById('round-num').textContent = G.round;
}

function updateOpponentCounts() {
  document.getElementById('left-count').textContent = opponentHands[1].length;
  document.getElementById('left-meld').textContent = opponentMelds[1].reduce((s,m) => s+m.cards.length, 0);
  document.getElementById('right-count').textContent = opponentHands[2].length;
  document.getElementById('right-meld').textContent = opponentMelds[2].reduce((s,m) => s+m.cards.length, 0);
}

function setPhase(text) {
  const el = document.getElementById('phase-text');
  el.textContent = text;
  el.classList.toggle('waiting', text.includes('等待'));
}

function addLog(who, action, card) {
  const list = document.getElementById('log-list');
  const item = document.createElement('div');
  item.className = 'log-item';
  item.innerHTML = who
    ? `<span class="log-who">${who}</span> <span class="log-act">${action}</span> ${card}`
    : `<span style="color:rgba(245,240,225,0.35)">${action}</span>`;
  list.prepend(item);
  while (list.children.length > 10) list.removeChild(list.lastChild);
}

/* ═══ 上/下家牌背 ═══ */
function buildSideHand(id, count) {
  const c = document.getElementById(id);
  for (let i = 0; i < count; i++) {
    const el = document.createElement('div');
    el.className = 'card card-back';
    el.innerHTML = '<span class="card-back-text">花</span>';
    if (i > 0) el.style.marginLeft = '-10px';
    c.appendChild(el);
  }
}

/* ═══ 初始化 ═══ */
layoutInitial();
buildSideHand('hand-right', 25);
buildSideHand('hand-left', 25);

let tipHidden = false;
function hideTip() { if (!tipHidden) { tipBar.style.opacity = '0'; tipHidden = true; } }
handZone.addEventListener('mousedown', hideTip, { once: true });
handZone.addEventListener('dblclick', hideTip, { once: true });
</script>
